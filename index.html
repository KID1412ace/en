<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔥 EPIC VOCAB | 終極溫暖手帳</title>
    <style>
        :root {
            --bg-color: #FFF3E0;   /* 溫潤奶油色 */
            --primary: #FF6B6B;    /* 珊瑚粉紅 */
            --secondary: #FCA311;  /* 暖陽橘黃 */
            --tertiary: #4ECDC4;   /* 柔和薄荷綠 */
            --dark: #3E2723;       /* 溫暖深可可色 */
            --border-thick: 6px solid var(--dark);
            --box-shadow-huge: 12px 12px 0px var(--dark);
            --box-shadow-hover: 18px 18px 0px var(--dark);
        }

        body, html { 
            margin: 0; padding: 0; width: 100%; min-height: 100%; 
            font-family: 'Nunito', 'Arial Black', Impact, sans-serif; 
            background-color: var(--bg-color); color: var(--dark); 
            overflow-x: hidden; scroll-behavior: smooth;
            background-image: radial-gradient(rgba(62, 39, 35, 0.1) 3px, transparent 3px);
            background-size: 40px 40px;
        }

        /* --- 誇張巨型動態裝飾 --- */
        .decor { position: fixed; z-index: 0; pointer-events: none; border: var(--border-thick); box-shadow: 8px 8px 0px var(--dark); }
        .decor-star {
            width: 200px; height: 200px; background: var(--secondary);
            top: 5%; left: -80px; 
            clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
            animation: spin 30s linear infinite;
        }
        .decor-blob {
            width: 250px; height: 250px; background: var(--tertiary);
            bottom: 10%; right: -100px; 
            border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%;
            animation: morphBlob 12s alternate infinite ease-in-out;
        }
        .decor-pill {
            width: 90px; height: 250px; background: var(--primary); border-radius: 50px;
            top: 30%; right: 3%; transform: rotate(20deg);
            animation: float 8s infinite alternate ease-in-out;
        }
        
        @keyframes spin { 100% { transform: rotate(360deg); } }
        @keyframes morphBlob { 0% { transform: scale(1) rotate(0deg); border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%; } 100% { transform: scale(1.1) rotate(20deg); border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%; } }
        @keyframes float { 0% { transform: translateY(0) rotate(20deg); } 100% { transform: translateY(-50px) rotate(10deg); } }

        /* --- Brutal 共用元件 --- */
        .brutal-box {
            background: #FFF; border: var(--border-thick); border-radius: 20px; 
            box-shadow: var(--box-shadow-huge); position: relative; z-index: 10;
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .brutal-btn {
            background: var(--primary); color: #FFF; border: var(--border-thick);
            padding: 18px 40px; font-size: 1.6rem; font-family: inherit; font-weight: 900;
            border-radius: 15px; box-shadow: 8px 8px 0px var(--dark); cursor: pointer; transition: 0.1s;
            text-transform: uppercase; letter-spacing: 2px;
        }
        .brutal-btn:hover { transform: translate(-4px, -4px); box-shadow: var(--box-shadow-hover); background: var(--secondary); color: var(--dark); }
        .brutal-btn:active { transform: translate(4px, 4px); box-shadow: 2px 2px 0px var(--dark); }

        /* --- 頁面佈局 --- */
        #homePage, #appPage { min-height: 100vh; padding: 4rem 2rem; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; z-index: 10;}
        #appPage { display: none; justify-content: flex-start; padding-top: 2rem;}
        
        .hero-title { font-size: 8rem; font-weight: 900; line-height: 0.9; color: var(--bg-color); text-shadow: 8px 8px 0px var(--dark), -4px -4px 0px var(--primary); margin: 0; text-align: center; transform: rotate(-3deg); -webkit-text-stroke: 4px var(--dark);}
        .hero-subtitle { font-size: 2.2rem; font-weight: bold; background: var(--tertiary); color: var(--dark); border: var(--border-thick); padding: 15px 35px; border-radius: 50px; transform: rotate(2deg); margin: 40px 0 60px 0; box-shadow: 8px 8px 0px var(--dark);}

        .app-container { width: 100%; max-width: 900px; }
        .nav-bar { display: flex; justify-content: space-between; margin-bottom: 3rem; }
        
        textarea { 
            width: 100%; padding: 25px; margin-bottom: 25px; border: var(--border-thick); border-radius: 16px;
            font-size: 1.8rem; font-weight: bold; resize: vertical; color: var(--dark);
            box-shadow: inset 8px 8px 0px rgba(62, 39, 35, 0.1); box-sizing: border-box; background: #FFF;
            transition: 0.2s; font-family: monospace;
        }
        textarea:focus { outline: none; background: #FFFCF2; border-color: var(--secondary); }

        /* --- 單字卡 --- */
        .vocab-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 3.5rem; margin-top: 2rem; padding-bottom: 6rem;}
        .vocab-card { padding: 2.5rem; display: flex; flex-direction: column; background: #FFF; transform: rotate(-1.5deg); }
        .vocab-card:nth-child(even) { transform: rotate(1.5deg); }
        .vocab-card:hover { transform: scale(1.05) rotate(0deg) translateY(-10px); box-shadow: var(--box-shadow-hover); z-index: 20;}
        
        /* 膠帶設計 */
        .tape { position: absolute; top: -20px; left: 50%; transform: translateX(-50%) rotate(-4deg); width: 140px; height: 45px; background: rgba(255, 107, 107, 0.9); border: var(--border-thick); z-index: 2;}
        .vocab-card:nth-child(even) .tape { background: rgba(78, 205, 196, 0.9); transform: translateX(-50%) rotate(4deg); }

        .word-title { font-size: 3rem; font-weight: 900; margin: 15px 0 20px 0; color: var(--dark); text-transform: lowercase; border-bottom: 6px solid var(--secondary); display: inline-block;}
        .pos-badge { font-size: 1.3rem; font-weight: bold; padding: 8px 20px; border: 4px solid var(--dark); border-radius: 12px; background: var(--secondary); box-shadow: 4px 4px 0px var(--dark); display: inline-block; margin-bottom: 25px;}
        .phonetic { font-size: 1.6rem; font-family: monospace; font-weight: 900; background: var(--dark); color: #FFF; padding: 10px 18px; border-radius: 10px; display: inline-block; margin-bottom: 25px; transform: skewX(-8deg);}
        .translation { font-size: 1.8rem; font-weight: bold; border-top: 5px dashed var(--dark); padding-top: 25px; margin-top: auto;}

        /* 發音與刪除按鈕 */
        .card-actions { display: flex; gap: 15px; margin-top: 35px; }
        .btn-speak { flex: 2; background: var(--tertiary); color: var(--dark); border: 4px solid var(--dark); border-radius: 12px; font-size: 1.5rem; font-weight: 900; cursor: pointer; padding: 15px; box-shadow: 5px 5px 0px var(--dark); transition: 0.1s;}
        .btn-speak:active { transform: translate(4px, 4px); box-shadow: 1px 1px 0px var(--dark); }
        .btn-del { flex: 1; background: var(--bg-color); color: var(--dark); border: 4px solid var(--dark); border-radius: 12px; font-size: 1.5rem; font-weight: 900; cursor: pointer; box-shadow: 5px 5px 0px var(--dark);}
        .btn-del:active { transform: translate(4px, 4px); box-shadow: 1px 1px 0px var(--dark); }
        
        #status { font-size: 1.8rem; font-weight: 900; background: #FFF; color: var(--dark); padding: 18px 40px; border: var(--border-thick); border-radius: 20px; display: none; position: fixed; top: 40px; left: 50%; transform: translateX(-50%); z-index: 1000; box-shadow: 12px 12px 0px var(--dark); }

        /* Modal */
        #addModal { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(62, 39, 35, 0.85); backdrop-filter: blur(10px); z-index: 2000; justify-content: center; align-items: center;}
        .modal-content { background: var(--bg-color); padding: 4rem; width: 90%; max-width: 550px; transform: rotate(-1deg); }
        .modal-content input { width: 100%; border: var(--border-thick); border-radius: 12px; font-size: 1.6rem; padding: 18px; margin-bottom: 25px; box-shadow: inset 5px 5px 0px rgba(0,0,0,0.05); box-sizing: border-box; font-family: inherit; font-weight: bold;}
    </style>
</head>
<body>

    <div class="decor decor-star"></div>
    <div class="decor decor-blob"></div>
    <div class="decor decor-pill"></div>

    <div id="status">系統訊息</div>

    <div id="homePage">
        <h1 class="hero-title">EPIC<br>VOCAB</h1>
        <div class="hero-subtitle">🚀 視覺衝擊！終極單字手帳 🚀</div>
        <button class="brutal-btn" style="font-size: 2.5rem; padding: 25px 70px;" onclick="switchPage('appPage')">LET'S GO ➔</button>
    </div>

    <div id="appPage">
        <div class="app-container">
            <div class="nav-bar">
                <button class="brutal-btn" style="background: #FFF; color: var(--dark);" onclick="switchPage('homePage')">🏠 返回</button>
                <button class="brutal-btn" style="background: var(--tertiary); color: var(--dark);" onclick="document.getElementById('addModal').style.display='flex'">➕ 手動擴充</button>
            </div>

            <div class="brutal-box" style="padding: 3.5rem; margin-bottom: 5rem;">
                <h2 style="margin-top:0; font-size: 3.5rem; font-weight: 900; text-transform: uppercase;">🔥 丟入文章</h2>
                <textarea id="article" rows="4" placeholder="把文章砸進來！"></textarea>
                <button id="submitBtn" class="brutal-btn" style="width: 100%; font-size: 2rem;" onclick="processText()">自動萃取 & 抓取 IPA 音標</button>
            </div>
            
            <div style="display:flex; justify-content:space-between; align-items:flex-end;">
                <h2 style="font-size: 4rem; margin-bottom: 0; font-weight: 900;">📚 單字庫</h2>
                <button class="brutal-btn" style="padding: 15px 30px; font-size: 1.6rem; background: var(--secondary); color:var(--dark);" onclick="loadVocabulary()">🔄 刷新</button>
            </div>
            <div id="vocabContainer" class="vocab-grid"></div>
        </div>
    </div>

    <div id="addModal">
        <div class="brutal-box modal-content">
            <h2 style="margin-top:0; font-size: 3.5rem; text-transform: uppercase;">➕ 暴力塞字</h2>
            <input type="text" id="m-word" placeholder="單字 (必填)">
            <input type="text" id="m-pos" placeholder="詞性 (例: Noun / Verb)">
            <input type="text" id="m-phonetic" placeholder="IPA 音標 (例: /æpəl/)">
            <input type="text" id="m-trans" placeholder="中文翻譯 (必填)">
            <div style="display:flex; gap:20px; margin-top:20px;">
                <button class="brutal-btn" style="background:#FFF; color:var(--dark); flex:1;" onclick="document.getElementById('addModal').style.display='none'">取消</button>
                <button class="brutal-btn" style="flex:1;" onclick="manualAddWord()">確認新增</button>
            </div>
        </div>
    </div>

    <script>
        // ⚠️ 請填入你剛剛「重新授權並發布為新版本」的 GAS 網址
        const GAS_URL = 'https://script.google.com/macros/s/AKfycbw2XJTyDTPHMCvdGe76FXTn8QAtI1SMoEtvM7L4TrJprufqQkamZ5Xdp0OUzs-wZqSG4g/exec'; 

        function switchPage(pageId) {
            document.getElementById('homePage').style.display = 'none';
            document.getElementById('appPage').style.display = 'none';
            document.getElementById(pageId).style.display = 'flex';
            if(pageId === 'appPage') loadVocabulary();
            window.scrollTo(0, 0);
        }

        function showMsg(msg) {
            const el = document.getElementById('status');
            el.innerText = msg; el.style.display = 'block';
            setTimeout(() => { el.style.display = 'none'; }, 3000);
        }

        function speakWord(word) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(word);
                utterance.lang = 'en-US';
                utterance.rate = 0.85; 
                window.speechSynthesis.speak(utterance);
            } else {
                alert("瀏覽器不支援發音功能！");
            }
        }

        async function processText() {
            const text = document.getElementById('article').value;
            const btn = document.getElementById('submitBtn');
            if (!text.trim()) return showMsg("⚠️ 內容不能為空！");

            btn.disabled = true; btn.innerText = "🔍 後端引擎解析中..."; showMsg("⏳ 正在萃取並抓取音標...");
            
            const wordsArray = text.toLowerCase().match(/\b[a-z]+\b/g) || [];
            const uniqueWords = [...new Set(wordsArray)];
            if (uniqueWords.length === 0) { btn.disabled = false; btn.innerText = "自動萃取 & 抓取 IPA 音標"; return showMsg("⚠️ 無有效單字"); }

            try {
                const res = await fetch(GAS_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'extract', words: uniqueWords }),
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' }
                });
                const result = await res.json();
                if (result.status === 'success') {
                    showMsg(`✅ 成功萃取 ${result.count} 個單字！`);
                    document.getElementById('article').value = '';
                    loadVocabulary();
                } else throw new Error(result.message);
            } catch (err) { showMsg("❌ 伺服器連線失敗"); console.error(err); }
            finally { btn.disabled = false; btn.innerText = "自動萃取 & 抓取 IPA 音標"; }
        }

        async function manualAddWord() {
            const word = document.getElementById('m-word').value;
            const trans = document.getElementById('m-trans').value;
            if(!word || !trans) return alert("單字跟翻譯為必填欄位！");

            let phonetic = document.getElementById('m-phonetic').value || "無音標";
            if (phonetic !== "無音標" && !phonetic.includes('/')) phonetic = `/${phonetic}/`;

            const payload = {
                action: 'add',
                word: word, pos: document.getElementById('m-pos').value || "Unknown",
                phonetic: phonetic,
                translation: trans
            };

            document.getElementById('addModal').style.display = 'none';
            showMsg("⏳ 寫入中...");

            try {
                await fetch(GAS_URL, {
                    method: 'POST', body: JSON.stringify(payload),
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' }
                });
                showMsg(`✅ 已新增 ${word}`);
                document.querySelectorAll('#addModal input').forEach(inp => inp.value = '');
                loadVocabulary();
            } catch (err) { showMsg("❌ 新增失敗"); }
        }

        async function deleteWord(word) {
            if(!confirm(`確定要刪除「${word}」嗎？`)) return;
            showMsg(`⏳ 刪除中...`);
            try {
                await fetch(GAS_URL, {
                    method: 'POST', body: JSON.stringify({ action: 'delete', word: word }),
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' }
                });
                showMsg(`✅ 已刪除`);
                loadVocabulary();
            } catch (err) { showMsg("❌ 刪除失敗"); }
        }

        async function loadVocabulary() {
            const container = document.getElementById('vocabContainer');
            container.innerHTML = '<h2 style="grid-column:1/-1; text-align:center; font-size:3rem;">翻開手帳中... 📖</h2>';

            try {
                const res = await fetch(GAS_URL);
                const result = await res.json();
                if (result.status === 'success') {
                    const data = result.data.reverse();
                    if (data.length === 0) return container.innerHTML = '<h2 style="grid-column:1/-1; text-align:center; font-size:3rem;">目前沒有單字，快去新增吧！</h2>';

                    container.innerHTML = data.map(item => `
                        <div class="brutal-box vocab-card">
                            <div class="tape"></div>
                            <div style="display:flex; justify-content:space-between; align-items:flex-start;">
                                <h3 class="word-title">${item.word}</h3>
                            </div>
                            <div><span class="pos-badge">${item.pos}</span></div>
                            <div class="phonetic">${item.phonetic}</div>
                            <div class="translation">${item.translation}</div>
                            <div class="card-actions">
                                <button class="btn-speak" onclick="speakWord('${item.word}')">🔊 PLAY</button>
                                <button class="btn-del" onclick="deleteWord('${item.word}')">✕ DEL</button>
                            </div>
                        </div>
                    `).join('');
                }
            } catch (err) { container.innerHTML = '<h2 style="grid-column:1/-1; text-align:center; color:red; font-size:3rem;">讀取失敗 💀</h2>'; }
        }
    </script>
</body>
</html>
