<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📖 VOCAB WORKBOOK | 英語學習手冊</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">

    <style>
        /* --- 經典學習手冊溫暖色系 --- */
        :root {
            --bg-color: #F4F1EA; --primary: #D9534F; --secondary: #F0AD4E;  
            --tertiary: #5BC0DE; --dark: #2C3E50; --border-thick: 4px solid var(--dark);
            --box-shadow-card: 6px 6px 0px var(--dark); --box-shadow-hover: 10px 10px 0px var(--dark);
            --success: #5CB85C; --paper-bg: #FFFFFF;
        }
        
        body, html { 
            margin: 0; padding: 0; width: 100%; min-height: 100%; 
            font-family: 'Nunito', sans-serif; 
            background-color: var(--bg-color); color: var(--dark); 
            overflow-x: hidden; scroll-behavior: smooth; 
            background-image: linear-gradient(90deg, rgba(44,62,80,0.04) 1px, transparent 1px), linear-gradient(0deg, rgba(44,62,80,0.04) 1px, transparent 1px);
            background-size: 20px 20px; 
        }
        
        .decor { position: fixed; z-index: 0; pointer-events: none; border: var(--border-thick); box-shadow: 4px 4px 0px var(--dark); }
        .decor-star { width: 100px; height: 100px; background: var(--secondary); top: 5%; left: -30px; clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%); }
        .decor-blob { width: 150px; height: 150px; background: var(--tertiary); bottom: 5%; right: -40px; border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%; }

        .brutal-box { background: var(--paper-bg); border: var(--border-thick); border-radius: 12px; box-shadow: var(--box-shadow-card); position: relative; z-index: 10; transition: all 0.2s; }
        .brutal-btn { background: var(--primary); color: #FFF; border: var(--border-thick); padding: 10px 20px; font-size: 1.1rem; font-family: 'Nunito', sans-serif; font-weight: 900; border-radius: 8px; box-shadow: 4px 4px 0px var(--dark); cursor: pointer; transition: 0.1s; text-transform: uppercase; }
        .brutal-btn:hover { transform: translate(-2px, -2px); box-shadow: 6px 6px 0px var(--dark); background: var(--secondary); color: var(--dark); }
        .brutal-btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0px var(--dark); }
        .brutal-btn:disabled { filter: grayscale(80%); cursor: not-allowed; }

        #homePage, #appPage, #trainPage, #quizPage { min-height: 100vh; padding: 2rem 1rem; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; z-index: 10;}
        #appPage, #trainPage, #quizPage { display: none; justify-content: flex-start; padding-top: 1.5rem;}
        
        .app-container { width: 100%; max-width: 900px; }
        
        /* 手冊化頂部導覽列 */
        .workbook-header { display: flex; justify-content: space-between; align-items: center; width: 100%; max-width: 550px; background: var(--paper-bg); border: var(--border-thick); border-radius: 12px; padding: 12px 20px; box-sizing: border-box; box-shadow: var(--box-shadow-card); margin-bottom: 25px; }
        
        .hero-title { font-size: 4rem; font-weight: 900; line-height: 1; color: var(--dark); text-shadow: 3px 3px 0px var(--secondary); margin: 0 0 15px 0; text-align: center;}
        .hero-subtitle { font-size: 1.2rem; font-weight: bold; background: var(--paper-bg); color: var(--dark); border: var(--border-thick); padding: 8px 20px; border-radius: 8px; margin-bottom: 30px; box-shadow: 4px 4px 0px var(--dark); text-align: center;}

        textarea, .brutal-input { width: 100%; padding: 12px; margin-bottom: 12px; border: var(--border-thick); border-radius: 8px; font-size: 1.1rem; font-weight: 700; color: var(--dark); box-sizing: border-box; background: var(--paper-bg); font-family: 'Nunito', sans-serif;}
        textarea { resize: vertical; }

        .filter-section { margin-bottom: 20px; }
        .filter-title { font-size: 1rem; font-weight: 900; margin-bottom: 6px; color: var(--dark); }
        .filter-bar { display: flex; gap: 8px; overflow-x: auto; padding: 5px; scrollbar-width: none; margin-bottom: 10px;}
        .filter-bar::-webkit-scrollbar { display: none; }
        .filter-btn { background: var(--paper-bg); color: var(--dark); border: 2px solid var(--dark); padding: 5px 12px; font-size: 0.9rem; font-weight: 900; border-radius: 20px; cursor: pointer; white-space: nowrap; box-shadow: 2px 2px 0px var(--dark); transition: 0.2s;}
        .filter-btn:hover { background: var(--secondary);}
        .filter-btn.active { background: var(--dark); color: #FFF; box-shadow: none; }

        .vocab-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 2rem; padding-bottom: 4rem;}
        .vocab-card { padding: 2rem 1rem 1rem 1rem; display: flex; flex-direction: column; }
        .vocab-card.learned { border-color: var(--success); opacity: 0.85;}
        
        .flip-container { perspective: 1000px; flex-grow: 1; cursor: pointer; min-height: 200px; margin-top: 5px; }
        .flip-inner { position: relative; width: 100%; height: 100%; text-align: center; transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1); transform-style: preserve-3d; }
        .flip-container.is-flipped .flip-inner { transform: rotateY(180deg); }
        
        /* 💡 【完美下移對齊】增加上方內距，讓單字向下移動不壓邊線 */
        .flip-front, .flip-back { 
            position: absolute; width: 100%; height: 100%; 
            backface-visibility: hidden; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            background: var(--paper-bg); border-radius: 8px; 
            padding: 25px 15px 15px 15px; 
            box-sizing: border-box; 
        }
        .flip-back { transform: rotateY(180deg); overflow-y: auto;}
        
        .cat-badge { position: absolute; top: 0; left: 0; background: var(--tertiary); border-bottom: 2px solid var(--dark); border-right: 2px solid var(--dark); padding: 2px 8px; font-weight: 900; font-size: 0.75rem; border-radius: 8px 0 6px 0;}
        .status-badge { position: absolute; top: -12px; right: -10px; background: var(--primary); color: #FFF; border: 2px solid var(--dark); padding: 2px 8px; font-weight: 900; font-size: 0.75rem; border-radius: 10px; box-shadow: 2px 2px 0px var(--dark); z-index: 5;}
        .status-badge.learned { background: var(--success); }
        
        .word-title { font-size: 2rem; font-weight: 900; margin: 0 0 5px 0; color: var(--dark); word-break: break-all; }
        .pos-badge { font-size: 0.9rem; font-weight: bold; padding: 2px 8px; border: 2px solid var(--dark); border-radius: 6px; background: var(--secondary); display: inline-block; margin-bottom: 6px;}
        .phonetic { font-size: 1.1rem; font-family: monospace; font-weight: 900; background: var(--dark); color: #FFF; padding: 3px 8px; border-radius: 4px; display: inline-block;}
        .translation-huge { font-size: 1.6rem; font-weight: 900; color: var(--primary); margin-bottom: 4px; word-break: break-all;}
        .ai-note { font-size: 0.85rem; font-weight: bold; color: #444; background: #FFF9E6; padding: 6px; border-radius: 6px; border: 2px solid var(--dark); margin-top: 4px; width: 95%; text-align: left; box-sizing: border-box;}
        
        .card-actions { display: flex; gap: 6px; margin-top: 10px; padding-top: 10px; border-top: 2px dashed rgba(44,62,80,0.2); }
        .btn-act { flex: 1; background: var(--paper-bg); color: var(--dark); border: 2px solid var(--dark); border-radius: 6px; font-size: 0.95rem; font-family: 'Nunito', sans-serif; font-weight: 900; cursor: pointer; padding: 6px; box-shadow: 2px 2px 0px var(--dark); transition: 0.1s;}
        .btn-act:active { transform: translate(1px, 1px); box-shadow: none; }
        
        .train-container { width: 100%; max-width: 550px; display: flex; flex-direction: column; align-items: center; justify-content: center; flex-grow: 1;}
        .train-card { width: 100%; min-height: 360px; padding: 1.5rem; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between;}
        .train-controls { display: flex; width: 100%; max-width: 550px; gap: 12px; margin-top: 20px; justify-content: space-between;}
        
        #status { font-size: 1.1rem; font-weight: 900; background: var(--paper-bg); color: var(--dark); padding: 8px 20px; border: var(--border-thick); border-radius: 8px; display: none; position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 1000; box-shadow: 4px 4px 0px var(--dark); }
        #addModal { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(44,62,80,0.7); backdrop-filter: blur(4px); z-index: 2000; justify-content: center; align-items: center;}
        .modal-content { background: var(--paper-bg); padding: 2rem; width: 90%; max-width: 400px; }
    </style>
</head>
<body>

    <div class="decor decor-star"></div>
    <div class="decor decor-blob"></div>
    <div id="status">系統訊息</div>

    <!-- 首頁 -->
    <div id="homePage">
        <h1 class="hero-title">VOCAB<br>WORKBOOK</h1>
        <div class="hero-subtitle">📖 AI 智慧英文學習手冊 📖</div>
        <button class="brutal-btn" style="font-size: 1.5rem; padding: 15px 35px;" onclick="switchPage('appPage')">翻開手冊 ➔</button>
    </div>

    <!-- 主頁 -->
    <div id="appPage">
        <div class="app-container">
            <div class="workbook-header">
                <button class="brutal-btn" style="background: var(--paper-bg); color: var(--dark); padding: 6px 14px; font-size: 0.95rem;" onclick="switchPage('homePage')">🏠 首頁</button>
                <div style="display: flex; gap:6px;">
                    <button class="brutal-btn" style="background: var(--tertiary); padding: 6px 12px; font-size: 0.95rem;" onclick="document.getElementById('addModal').style.display='flex'">➕ 新增</button>
                    <button class="brutal-btn" style="background: var(--secondary); padding: 6px 12px; font-size: 0.95rem;" onclick="startQuiz()">📝 測驗</button>
                    <button class="brutal-btn" style="background: var(--primary); padding: 6px 12px; font-size: 0.95rem;" onclick="startTraining()">🎯 訓練</button>
                </div>
            </div>

            <div class="brutal-box" style="padding: 1.5rem; margin-bottom: 1.5rem;">
                <h3 style="margin-top:0; font-size: 1.2rem; font-weight: 900;">✨ AI 智慧單字匯入</h3>
                <textarea id="article" rows="2" placeholder="貼上英文文章，手冊將自動萃取單字、口訣與例句..."></textarea>
                <button id="submitBtn" class="brutal-btn" style="width: 100%; background: var(--dark); color: #FFF; padding: 10px;" onclick="processTextWithAI()">🚀 開始解析</button>
            </div>
            
            <div class="filter-section">
                <div class="filter-title">🏷️ 類別過濾</div>
                <div id="categoryBar" class="filter-bar"></div>
                <div class="filter-title">🧠 記憶狀態</div>
                <div class="filter-bar">
                    <button class="filter-btn active" id="filter-all" onclick="setStatusFilter('全部')">全部</button>
                    <button class="filter-btn" id="filter-learning" onclick="setStatusFilter('學習中')">📚 學習中</button>
                    <button class="filter-btn" id="filter-learned" onclick="setStatusFilter('已記住')">✅ 已記住</button>
                </div>
            </div>

            <div style="display:flex; justify-content:space-between; align-items:flex-end; margin-bottom: 12px;">
                <h3 style="font-size: 1.5rem; margin: 0; font-weight: 900;">📚 我的單字筆記</h3>
                <button class="brutal-btn" style="padding: 6px 12px; font-size: 0.9rem; background: var(--secondary);" onclick="fetchDataFromServer()">🔄 同步</button>
            </div>
            
            <div id="vocabContainer" class="vocab-grid"></div>
        </div>
    </div>

    <!-- 訓練模式 -->
    <div id="trainPage">
        <div class="workbook-header">
            <button class="brutal-btn" style="background: var(--paper-bg); color: var(--dark); padding: 6px 14px; font-size: 0.95rem;" onclick="switchPage('appPage')">🔙 退出</button>
            <span id="trainProgress" style="font-weight: 900; font-size: 1.1rem;">1 / 10</span>
        </div>
        <div class="train-container">
            <div id="trainCardContainer" style="width: 100%;"></div>
            <div class="train-controls">
                <button class="brutal-btn" style="flex: 1; background: var(--paper-bg); color: var(--dark); padding: 10px;" onclick="prevCard()">⬅️ 上一張</button>
                <button class="brutal-btn" style="flex: 1; background: var(--secondary); color: var(--dark); padding: 10px;" onclick="nextCard()">下一張 ➡️</button>
            </div>
        </div>
    </div>

    <!-- AI 測驗模式頁面 -->
    <div id="quizPage">
        <div class="workbook-header">
            <button class="brutal-btn" style="background: var(--paper-bg); color: var(--dark); padding: 6px 14px; font-size: 0.95rem;" onclick="switchPage('appPage')">🔙 退出</button>
            <span style="font-weight: 900; font-size: 1.1rem;">📝 隨堂考</span>
        </div>
        <div class="train-container" id="quizContainer"></div>
    </div>

    <!-- 新增 Modal -->
    <div id="addModal">
        <div class="brutal-box modal-content">
            <h3 style="margin-top:0; font-size: 1.5rem;">➕ 手動新增單字</h3>
            <input type="text" id="m-word" placeholder="單字 (必填)">
            <input type="text" id="m-category" placeholder="類別 (例: 專案開發)">
            <input type="text" id="m-pos" placeholder="詞性">
            <input type="text" id="m-phonetic" placeholder="IPA 音標">
            <input type="text" id="m-trans" placeholder="中文翻譯 (必填)">
            <div style="display:flex; gap:10px; margin-top:15px;">
                <button class="brutal-btn" style="background:var(--paper-bg); color:var(--dark); flex:1;" onclick="document.getElementById('addModal').style.display='none'">取消</button>
                <button class="brutal-btn" style="flex:1;" onclick="manualAddWord()">確定</button>
            </div>
        </div>
    </div>

    <script>
        const GAS_URL = 'https://script.google.com/macros/s/AKfycbw2XJTyDTPHMCvdGe76FXTn8QAtI1SMoEtvM7L4TrJprufqQkamZ5Xdp0OUzs-wZqSG4g/exec'; // ⚠️ 請確保填入你的網址
        
        let vocabCache = []; 
        let currentCategory = '全部'; 
        let currentStatus = '全部'; 
        let trainQueue = []; 
        let trainIndex = 0;

        function switchPage(pageId) {
            document.getElementById('homePage').style.display = 'none';
            document.getElementById('appPage').style.display = 'none';
            document.getElementById('trainPage').style.display = 'none';
            document.getElementById('quizPage').style.display = 'none';
            document.getElementById(pageId).style.display = 'flex';
            if(pageId === 'appPage' && vocabCache.length === 0) fetchDataFromServer();
            window.scrollTo(0, 0);
        }

        function showMsg(msg) {
            const el = document.getElementById('status');
            el.innerText = msg; el.style.display = 'block';
            setTimeout(() => { el.style.display = 'none'; }, 3000);
        }

        function speakWord(event, word) {
            if(event) event.stopPropagation(); 
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(word);
                utterance.lang = 'en-US';
                window.speechSynthesis.speak(utterance);
            }
        }

        async function processTextWithAI() {
            const text = document.getElementById('article').value;
            const btn = document.getElementById('submitBtn');
            if (!text.trim()) return showMsg("⚠️ 請先輸入文章！");

            btn.disabled = true; btn.innerText = "✨ AI 解析中..."; showMsg("⏳ 正在生成筆記...");

            try {
                const response = await fetch(GAS_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'ai_extract', text: text }),
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' }
                });

                const result = await response.json();
                if (result.status === 'success') {
                    showMsg(`✅ 成功加入 ${result.count} 個單字！`);
                    document.getElementById('article').value = '';
                    fetchDataFromServer(); 
                } else { throw new Error(result.message); }
            } catch (err) { showMsg("❌ 解析失敗：" + err.message); }
            finally { btn.disabled = false; btn.innerText = "🚀 開始解析"; }
        }

        async function startQuiz() {
            if(vocabCache.length === 0) return alert("筆記本是空的！");
            showMsg("⏳ AI 正在出題...");
            
            const randomWords = vocabCache.map(w => w.word).sort(() => 0.5 - Math.random()).slice(0, 5);

            try {
                const res = await fetch(GAS_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'ai_quiz', words: randomWords }),
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' }
                });
                const result = await res.json();
                if(result.status === 'success' && result.quiz) {
                    renderQuiz(result.quiz);
                    switchPage('quizPage');
                } else { throw new Error(); }
            } catch(e) { showMsg("❌ 出題失敗"); }
        }

        function renderQuiz(quizList) {
            const container = document.getElementById('quizContainer');
            let currentQ = 0;

            function showQuestion() {
                if(currentQ >= quizList.length) {
                    container.innerHTML = `
                        <div class="brutal-box train-card" style="text-align:center; justify-content:center;">
                            <h2>🎉 測驗完成！</h2>
                            <p style="font-size: 1.2rem;">你已完成本輪複習。</p>
                            <button class="brutal-btn" style="background:var(--success); color:#FFF; margin-top:15px;" onclick="switchPage('appPage')">返回手冊</button>
                        </div>`;
                    return;
                }
                const q = quizList[currentQ];
                container.innerHTML = `
                    <div class="brutal-box train-card" style="justify-content: flex-start;">
                        <h3>問題 ${currentQ + 1} / ${quizList.length}</h3>
                        <p style="font-size: 1.1rem; font-weight:900; margin:10px 0;">${q.question}</p>
                        <div style="display:flex; flex-direction:column; gap:8px; width:100%;">
                            ${q.options.map(opt => `
                                <button class="brutal-btn" style="background:var(--paper-bg); color:var(--dark); text-align:left; font-size:1rem; padding:10px;" onclick="checkAnswer(this, '${opt}', '${q.answer}')">${opt}</button>
                            `).join('')}
                        </div>
                    </div>`;
            }

            window.checkAnswer = function(btn, selected, correct) {
                if(selected === correct) {
                    btn.style.background = 'var(--success)';
                    btn.style.color = '#FFF';
                    showMsg("✅ 答對了！");
                    setTimeout(() => { currentQ++; showQuestion(); }, 1000);
                } else {
                    btn.style.background = 'var(--primary)';
                    btn.style.color = '#FFF';
                    showMsg("❌ 正確答案是：" + correct);
                }
            };
            showQuestion();
        }

        function setCategory(cat) { currentCategory = cat; renderCards(); }
        function setStatusFilter(status) {
            currentStatus = status;
            document.querySelectorAll('#appPage .filter-section .filter-bar')[1].querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            if(status === '全部') document.getElementById('filter-all').classList.add('active');
            if(status === '學習中') document.getElementById('filter-learning').classList.add('active');
            if(status === '已記住') document.getElementById('filter-learned').classList.add('active');
            renderCards();
        }

        function getFilteredData() {
            return vocabCache.filter(item => {
                const matchCat = currentCategory === '全部' || item.category === currentCategory;
                const matchStatus = currentStatus === '全部' || item.status === currentStatus;
                return matchCat && matchStatus;
            });
        }

        function renderCards() {
            const container = document.getElementById('vocabContainer');
            const catBar = document.getElementById('categoryBar');
            
            if (vocabCache.length === 0) {
                catBar.innerHTML = '';
                container.innerHTML = '<h2 style="grid-column:1/-1; text-align:center;">手冊內尚無單字</h2>';
                return;
            }

            const categories = ['全部', ...new Set(vocabCache.map(item => item.category))];
            catBar.innerHTML = categories.map(cat => `
                <button class="filter-btn ${cat === currentCategory ? 'active' : ''}" onclick="setCategory('${cat}')">${cat}</button>
            `).join('');

            const filteredData = getFilteredData();
            if(filteredData.length === 0) {
                container.innerHTML = '<h2 style="grid-column:1/-1; text-align:center;">此分類無單字</h2>';
                return;
            }

            container.innerHTML = filteredData.map(item => {
                const isLearned = item.status === '已記住';
                return `
                <div class="brutal-box vocab-card ${isLearned ? 'learned' : ''}">
                    <div class="status-badge ${isLearned ? 'learned' : ''}">${item.status}</div>
                    
                    <div class="flip-container" onclick="this.classList.toggle('is-flipped')">
                        <div class="flip-inner">
                            <div class="flip-front">
                                <div class="cat-badge">${item.category}</div>
                                <h3 class="word-title">${item.word}</h3>
                                <span class="pos-badge">${item.pos}</span>
                                <div class="phonetic">${item.phonetic}</div>
                                <div style="font-size:0.8rem; color:#555; margin-top:6px;">💡 ${item.mnemonic || ''}</div>
                            </div>
                            <div class="flip-back">
                                <div class="cat-badge">${item.category}</div>
                                <div class="translation-huge">${item.translation}</div>
                                <div class="ai-note"><strong>📖 例句：</strong><br>${item.example || ''}</div>
                            </div>
                        </div>
                    </div>
                    <div class="card-actions">
                        <button class="btn-act" onclick="speakWord(event, '${item.word}')">🔊 唸</button>
                        ${isLearned 
                            ? `<button class="btn-act" style="background:var(--secondary);" onclick="updateStatus(event, '${item.word}', '學習中')">🔄 忘記</button>`
                            : `<button class="btn-act" style="background:var(--success); color:white;" onclick="updateStatus(event, '${item.word}', '已記住')">✅ 記住</button>`
                        }
                        <button class="btn-act" style="background:#FF595E; color:white;" onclick="deleteWord(event, '${item.word}')">✕ 刪</button>
                    </div>
                </div>
            `}).join('');
        }

        function startTraining() {
            trainQueue = getFilteredData().filter(w => w.status === '學習中');
            if(trainQueue.length === 0) return alert("目前沒有「學習中」的單字！");
            
            trainQueue = trainQueue.sort(() => Math.random() - 0.5);
            trainIndex = 0;
            switchPage('trainPage');
            renderTrainCard();
        }

        function renderTrainCard() {
            document.getElementById('trainProgress').innerText = `${trainIndex + 1} / ${trainQueue.length}`;
            const item = trainQueue[trainIndex];
            
            document.getElementById('trainCardContainer').innerHTML = `
                <div class="brutal-box train-card">
                    <div class="flip-container" onclick="this.classList.toggle('is-flipped')" style="min-height: 200px;">
                        <div class="flip-inner">
                            <div class="flip-front">
                                <h3 class="word-title" style="text-align: center;">${item.word}</h3>
                                <div class="phonetic" style="font-size: 1.3rem;">${item.phonetic}</div>
                                <div style="font-size:0.85rem; color:#555; margin-top:8px;">💡 ${item.mnemonic || ''}</div>
                                <div style="font-size:0.75rem; color:#aaa; margin-top:4px;">👉 點擊翻面</div>
                            </div>
                            <div class="flip-back">
                                <span class="pos-badge">${item.pos}</span>
                                <div class="translation-huge" style="text-align: center;">${item.translation}</div>
                                <div class="ai-note" style="margin-top:8px;"><strong>📖 例句：</strong><br>${item.example || ''}</div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="card-actions" style="margin-top: 10px;">
                        <button class="btn-act" style="background:var(--tertiary);" onclick="speakWord(event, '${item.word}')">🔊 唸</button>
                        <button class="btn-act" style="background:#FF595E; color:white;" onclick="trainSetStatus(event, '${item.word}', '學習中')">❌ 沒記住</button>
                        <button class="btn-act" style="background:var(--success); color:white;" onclick="trainSetStatus(event, '${item.word}', '已記住')">✅ 記住了</button>
                    </div>
                </div>
            `;
        }

        async function trainSetStatus(event, word, newStatus) {
            event.stopPropagation();
            showMsg("⏳ 記錄中...");
            try {
                await fetch(GAS_URL, {
                    method: 'POST', body: JSON.stringify({ action: 'update_status', word: word, newStatus: newStatus }),
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' }
                });
                const idx = vocabCache.findIndex(w => w.word === word);
                if(idx !== -1) vocabCache[idx].status = newStatus;
                showMsg(`✅ 已更新`);
                nextCard();
            } catch (err) { showMsg("❌ 更新失敗"); }
        }

        function nextCard() {
            if (trainIndex < trainQueue.length - 1) { trainIndex++; renderTrainCard(); } 
            else { alert("🎉 本輪訓練結束！"); switchPage('appPage'); }
        }

        function prevCard() {
            if (trainIndex > 0) { trainIndex--; renderTrainCard(); } 
            else { showMsg("已是第一張"); }
        }

        async function fetchDataFromServer() {
            const container = document.getElementById('vocabContainer');
            container.innerHTML = '<h2 style="grid-column:1/-1; text-align:center;">同步中...</h2>';
            try {
                const res = await fetch(GAS_URL);
                const result = await res.json();
                if (result.status === 'success') {
                    vocabCache = result.data.reverse();
                    renderCards();
                }
            } catch (err) { container.innerHTML = '<h2 style="grid-column:1/-1; text-align:center; color:red;">讀取失敗</h2>'; }
        }

        async function manualAddWord() {
            const rawWord = document.getElementById('m-word').value;
            const trans = document.getElementById('m-trans').value;
            if(!rawWord || !trans) return alert("單字與翻譯為必填");
            
            showMsg("⏳ 新增中...");
            document.getElementById('addModal').style.display = 'none';

            const payload = {
                action: 'add', word: rawWord,
                pos: document.getElementById('m-pos').value || 'Unknown',
                phonetic: document.getElementById('m-phonetic').value || '無音標',
                translation: trans, category: document.getElementById('m-category').value || '自訂單字'
            };

            try {
                await fetch(GAS_URL, {
                    method: 'POST', body: JSON.stringify(payload),
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' }
                });
                showMsg(`✅ 已新增`);
                document.querySelectorAll('#addModal input').forEach(inp => inp.value = '');
                fetchDataFromServer();
            } catch (err) { showMsg("❌ 新增失敗"); }
        }

        async function updateStatus(event, word, newStatus) {
            event.stopPropagation();
            showMsg("⏳ 更新中...");
            try {
                await fetch(GAS_URL, {
                    method: 'POST', body: JSON.stringify({ action: 'update_status', word: word, newStatus: newStatus }),
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' }
                });
                showMsg(`✅ 狀態已更新`);
                const idx = vocabCache.findIndex(w => w.word === word);
                if(idx !== -1) vocabCache[idx].status = newStatus;
                renderCards();
            } catch (err) { showMsg("❌ 更新失敗"); }
        }

        async function deleteWord(event, word) {
            event.stopPropagation(); 
            if(!confirm(`確定要刪除「${word}」嗎？`)) return;
            showMsg("⏳ 刪除中...");
            try {
                await fetch(GAS_URL, {
                    method: 'POST', body: JSON.stringify({ action: 'delete', word: word }),
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' }
                });
                showMsg(`✅ 已刪除`);
                fetchDataFromServer(); 
            } catch (err) { showMsg("❌ 刪除失敗"); }
        }
    </script>
</body>
</html>
