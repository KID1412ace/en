<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔥 EPIC VOCAB | 智慧翻轉手帳</title>
    <style>
        /* --- 溫暖粗獷調色盤 --- */
        :root {
            --bg-color: #FFF3E0; --primary: #FF6B6B; --secondary: #FCA311;  
            --tertiary: #4ECDC4; --dark: #3E2723; --border-thick: 6px solid var(--dark);
            --box-shadow-huge: 10px 10px 0px var(--dark); --box-shadow-hover: 16px 16px 0px var(--dark);
        }
        
        body, html { margin: 0; padding: 0; width: 100%; min-height: 100%; font-family: 'Nunito', 'Arial Black', Impact, sans-serif; background-color: var(--bg-color); color: var(--dark); overflow-x: hidden; scroll-behavior: smooth; background-image: radial-gradient(rgba(62, 39, 35, 0.1) 3px, transparent 3px); background-size: 35px 35px; }
        
        /* 動態背景裝飾 */
        .decor { position: fixed; z-index: 0; pointer-events: none; border: var(--border-thick); box-shadow: 6px 6px 0px var(--dark); }
        .decor-star { width: 150px; height: 150px; background: var(--secondary); top: 5%; left: -50px; clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%); animation: spin 25s linear infinite;}
        .decor-blob { width: 200px; height: 200px; background: var(--tertiary); bottom: 10%; right: -80px; border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%; animation: morphBlob 10s alternate infinite ease-in-out;}
        @keyframes spin { 100% { transform: rotate(360deg); } }
        @keyframes morphBlob { 0% { transform: scale(1) rotate(0deg); border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%; } 100% { transform: scale(1.1) rotate(20deg); border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%; } }

        /* UI 元件 */
        .brutal-box { background: #FFF; border: var(--border-thick); border-radius: 20px; box-shadow: var(--box-shadow-huge); position: relative; z-index: 10; transition: all 0.2s; }
        .brutal-btn { background: var(--primary); color: #FFF; border: var(--border-thick); padding: 15px 30px; font-size: 1.4rem; font-family: inherit; font-weight: 900; border-radius: 15px; box-shadow: 6px 6px 0px var(--dark); cursor: pointer; transition: 0.1s; text-transform: uppercase; }
        .brutal-btn:hover { transform: translate(-3px, -3px); box-shadow: var(--box-shadow-hover); background: var(--secondary); color: var(--dark); }
        .brutal-btn:active { transform: translate(3px, 3px); box-shadow: 2px 2px 0px var(--dark); }
        .brutal-btn:disabled { filter: grayscale(80%); cursor: not-allowed; transform: none; box-shadow: 6px 6px 0px var(--dark); }

        /* 版面配置 */
        #homePage, #appPage { min-height: 100vh; padding: 3rem 1.5rem; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; z-index: 10;}
        #appPage { display: none; justify-content: flex-start; padding-top: 1.5rem;}
        .app-container { width: 100%; max-width: 900px; }
        .nav-bar { display: flex; justify-content: space-between; margin-bottom: 2rem; }
        
        .hero-title { font-size: 15vw; max-font-size: 7rem; font-weight: 900; line-height: 0.9; color: var(--bg-color); text-shadow: 6px 6px 0px var(--dark), -3px -3px 0px var(--primary); margin: 0; text-align: center; transform: rotate(-3deg); -webkit-text-stroke: 3px var(--dark);}
        .hero-subtitle { font-size: 1.8rem; font-weight: bold; background: var(--tertiary); color: var(--dark); border: var(--border-thick); padding: 10px 25px; border-radius: 50px; transform: rotate(2deg); margin: 30px 0 50px 0; box-shadow: 6px 6px 0px var(--dark); text-align: center;}

        textarea, .brutal-input { width: 100%; padding: 20px; margin-bottom: 15px; border: var(--border-thick); border-radius: 16px; font-size: 1.5rem; font-weight: bold; color: var(--dark); box-shadow: inset 6px 6px 0px rgba(62, 39, 35, 0.08); box-sizing: border-box; background: #FFF; font-family: inherit;}
        textarea { resize: vertical; font-family: monospace; }
        textarea:focus, .brutal-input:focus { outline: none; background: #FFFCF2; border-color: var(--secondary); }
        .input-label { font-size: 1.3rem; font-weight: 900; margin-bottom: 8px; display: block; color: var(--dark); }

        /* 分類標籤列 */
        .category-bar { display: flex; gap: 12px; margin-bottom: 25px; overflow-x: auto; padding: 10px 5px; scrollbar-width: none; }
        .category-bar::-webkit-scrollbar { display: none; }
        .cat-btn { background: #FFF; color: var(--dark); border: 3px solid var(--dark); padding: 8px 20px; font-size: 1.2rem; font-weight: 900; border-radius: 50px; cursor: pointer; white-space: nowrap; box-shadow: 4px 4px 0px var(--dark); transition: 0.2s;}
        .cat-btn:hover { transform: translateY(-3px); box-shadow: 6px 6px 0px var(--dark); background: var(--secondary);}
        .cat-btn.active { background: var(--primary); color: #FFF; transform: translate(2px, 2px); box-shadow: 2px 2px 0px var(--dark); }

        /* 卡片與 3D 翻牌特效 */
        .vocab-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 3rem; padding-bottom: 5rem;}
        .vocab-card { padding: 2.5rem 1.5rem 1.5rem 1.5rem; display: flex; flex-direction: column; background: #FFF; transform: rotate(-1deg); }
        .vocab-card:nth-child(even) { transform: rotate(1deg); }
        .vocab-card:hover { transform: scale(1.03) rotate(0deg) translateY(-5px); box-shadow: var(--box-shadow-hover); z-index: 20;}
        .tape { position: absolute; top: -15px; left: 50%; transform: translateX(-50%) rotate(-3deg); width: 120px; height: 35px; background: rgba(255, 107, 107, 0.9); border: 4px solid var(--dark); z-index: 2;}
        .vocab-card:nth-child(even) .tape { background: rgba(78, 205, 196, 0.9); transform: translateX(-50%) rotate(3deg); }

        .flip-container { perspective: 1000px; flex-grow: 1; cursor: pointer; min-height: 200px; margin-top: 5px; }
        .flip-inner { position: relative; width: 100%; height: 100%; text-align: center; transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1); transform-style: preserve-3d; }
        .flip-container.is-flipped .flip-inner { transform: rotateY(180deg); }
        .flip-front, .flip-back { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #FFF; }
        .flip-back { transform: rotateY(180deg); }
        
        .cat-badge { position: absolute; top: 0; left: 0; background: var(--tertiary); border-bottom: 3px solid var(--dark); border-right: 3px solid var(--dark); padding: 4px 10px; font-weight: 900; font-size: 0.9rem; border-radius: 12px 0 10px 0;}
        .word-title { font-size: 2.5rem; font-weight: 900; margin: 0 0 10px 0; color: var(--dark); text-transform: lowercase;}
        .pos-badge { font-size: 1.1rem; font-weight: bold; padding: 4px 15px; border: 3px solid var(--dark); border-radius: 10px; background: var(--secondary); box-shadow: 3px 3px 0px var(--dark); display: inline-block; margin-bottom: 15px;}
        .phonetic { font-size: 1.4rem; font-family: monospace; font-weight: 900; background: var(--dark); color: #FFF; padding: 6px 12px; border-radius: 8px; display: inline-block; transform: skewX(-6deg);}
        .translation-huge { font-size: 2.2rem; font-weight: 900; color: var(--primary); border-bottom: 5px dashed var(--dark); padding-bottom: 10px;}
        .flip-hint { font-size: 0.9rem; font-weight: 900; color: #AAA; margin-top: 15px; animation: bounceHint 1.5s infinite; }
        @keyframes bounceHint { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(6px); } }

        .card-actions { display: flex; gap: 10px; margin-top: 15px; padding-top: 15px; border-top: 3px dashed rgba(0,0,0,0.1); }
        .btn-speak { flex: 2; background: var(--tertiary); color: var(--dark); border: 3px solid var(--dark); border-radius: 10px; font-size: 1.2rem; font-weight: 900; cursor: pointer; padding: 10px; box-shadow: 4px 4px 0px var(--dark); transition: 0.1s;}
        .btn-speak:active { transform: translate(3px, 3px); box-shadow: 1px 1px 0px var(--dark); }
        .btn-del { flex: 1; background: var(--bg-color); color: var(--dark); border: 3px solid var(--dark); border-radius: 10px; font-size: 1.2rem; font-weight: 900; cursor: pointer; box-shadow: 4px 4px 0px var(--dark);}
        
        #status { font-size: 1.4rem; font-weight: 900; background: #FFF; color: var(--dark); padding: 12px 30px; border: var(--border-thick); border-radius: 15px; display: none; position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 1000; box-shadow: 8px 8px 0px var(--dark); }
        #addModal { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(62, 39, 35, 0.85); backdrop-filter: blur(8px); z-index: 2000; justify-content: center; align-items: center;}
        .modal-content { background: var(--bg-color); padding: 2.5rem; width: 90%; max-width: 450px; transform: rotate(-1deg); overflow-y: auto; max-height: 90vh;}
        .modal-content input { width: 100%; border: var(--border-thick); border-radius: 10px; font-size: 1.3rem; padding: 12px; margin-bottom: 15px; box-shadow: inset 4px 4px 0px rgba(0,0,0,0.05); box-sizing: border-box; font-family: inherit; font-weight: bold;}
    </style>
</head>
<body>

    <div class="decor decor-star"></div>
    <div class="decor decor-blob"></div>
    <div id="status">系統訊息</div>

    <!-- 首頁 -->
    <div id="homePage">
        <h1 class="hero-title">EPIC<br>VOCAB</h1>
        <div class="hero-subtitle">🚀 視覺衝擊！智慧分類手帳 🚀</div>
        <button class="brutal-btn" style="font-size: 2rem; padding: 20px 50px;" onclick="switchPage('appPage')">LET'S GO ➔</button>
    </div>

    <!-- 系統頁面 -->
    <div id="appPage">
        <div class="app-container">
            <div class="nav-bar">
                <button class="brutal-btn" style="background: #FFF; color: var(--dark);" onclick="switchPage('homePage')">🏠 返回</button>
                <button class="brutal-btn" style="background: var(--tertiary); color: var(--dark);" onclick="document.getElementById('addModal').style.display='flex'">➕ 手動擴充</button>
            </div>

            <div class="brutal-box" style="padding: 2.5rem; margin-bottom: 3rem;">
                <h2 style="margin-top:0; font-size: 2.5rem; font-weight: 900;">🔥 丟入文章</h2>
                <span class="input-label">🏷️ 自訂類別 (若留白則啟動專業 AI 判定)：</span>
                <input type="text" id="batchCategory" class="brutal-input" placeholder="例：期末考範圍、多益必考...">
                <textarea id="article" rows="3" placeholder="貼上滿滿的英文文獻..."></textarea>
                <button id="submitBtn" class="brutal-btn" style="width: 100%; font-size: 1.6rem;" onclick="processText()">自動萃取 & 智慧分類</button>
            </div>
            
            <div style="display:flex; justify-content:space-between; align-items:flex-end; flex-wrap: wrap; gap: 10px;">
                <h2 style="font-size: 3rem; margin: 0; font-weight: 900;">📚 單字翻翻卡</h2>
                <button class="brutal-btn" style="padding: 10px 20px; font-size: 1.2rem; background: var(--secondary); color:var(--dark);" onclick="fetchDataFromServer()">🔄 雲端同步</button>
            </div>

            <!-- 動態分類標籤列 -->
            <div id="categoryBar" class="category-bar"></div>
            
            <!-- 卡片容器 -->
            <div id="vocabContainer" class="vocab-grid"></div>
        </div>
    </div>

    <!-- 新增 Modal -->
    <div id="addModal">
        <div class="brutal-box modal-content">
            <h2 style="margin-top:0; font-size: 2.5rem;">➕ 暴力塞字</h2>
            <input type="text" id="m-word" placeholder="單字 (必填)">
            <input type="text" id="m-category" placeholder="自訂類別 (例: 程式語言)">
            <input type="text" id="m-pos" placeholder="詞性 (例: Noun)">
            <input type="text" id="m-phonetic" placeholder="IPA 音標 (例: /æpəl/)">
            <input type="text" id="m-trans" placeholder="中文翻譯 (必填)">
            <div style="display:flex; gap:15px; margin-top:15px;">
                <button class="brutal-btn" style="background:#FFF; color:var(--dark); flex:1;" onclick="document.getElementById('addModal').style.display='none'">取消</button>
                <button class="brutal-btn" style="flex:1;" onclick="manualAddWord()">確認新增</button>
            </div>
        </div>
    </div>

    <script>
        // ⚠️ 【非常重要】請將下方引號內的網址替換為你最新的 GAS API 網址！
        const GAS_URL = 'https://script.google.com/macros/s/AKfycbw2XJTyDTPHMCvdGe76FXTn8QAtI1SMoEtvM7L4TrJprufqQkamZ5Xdp0OUzs-wZqSG4g/exec'; 
        
        let vocabCache = []; 
        let currentCategory = '全部'; 

        function switchPage(pageId) {
            document.getElementById('homePage').style.display = 'none';
            document.getElementById('appPage').style.display = 'none';
            document.getElementById(pageId).style.display = 'flex';
            if(pageId === 'appPage' && vocabCache.length === 0) fetchDataFromServer();
            window.scrollTo(0, 0);
        }

        function showMsg(msg) {
            const el = document.getElementById('status');
            el.innerText = msg; el.style.display = 'block';
            setTimeout(() => { el.style.display = 'none'; }, 3000);
        }

        function speakWord(event, word) {
            event.stopPropagation(); 
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(word);
                utterance.lang = 'en-US';
                window.speechSynthesis.speak(utterance);
            }
        }

        // --- 🤖 專業領域特化版分類引擎 (Smart Production & QA) ---
        function autoCategorize(word, pos) {
            const w = word.toLowerCase();
            
            const qaKeywords = ['quality', 'assurance', 'testing', 'automation', 'validation', 'verification', 'vulnerability', 'script', 'injection', 'xss', 'security', 'bug', 'debug', 'scenario'];
            const productionKeywords = ['production', 'manufacturing', 'smart', 'factory', 'sensor', 'robotics', 'optimization', 'integration', 'machinery', 'yield', 'equipment', 'logistics', 'assembly'];
            const dataKeywords = ['python', 'pandas', 'numpy', 'classification', 'regression', 'model', 'dataset', 'algorithm', 'predict', 'scraping'];
            const webKeywords = ['frontend', 'backend', 'flask', 'api', 'database', 'sqlite', 'server', 'framework', 'interface', 'deploy'];

            if (qaKeywords.some(k => w.includes(k))) return "軟體品管與測試";
            if (productionKeywords.some(k => w.includes(k))) return "智慧生產工程";
            if (dataKeywords.some(k => w.includes(k))) return "數據與機器學習";
            if (webKeywords.some(k => w.includes(k))) return "網頁與後端開發";

            if (pos === "Verb") return "動詞大補帖";
            if (pos === "Adjective") return "形容詞彙";
            if (pos === "Noun") return "專業名詞";
            return "生活與綜合";
        }

        // --- 介面渲染與資料過濾 ---
        function renderCards() {
            const container = document.getElementById('vocabContainer');
            const catBar = document.getElementById('categoryBar');
            
            if (vocabCache.length === 0) {
                catBar.innerHTML = '';
                container.innerHTML = '<h2 style="grid-column:1/-1; text-align:center; font-size:2rem; padding: 2rem;">空空如也，快去塞字進來！</h2>';
                return;
            }

            const categories = ['全部', ...new Set(vocabCache.map(item => item.category))];
            catBar.innerHTML = categories.map(cat => `
                <button class="cat-btn ${cat === currentCategory ? 'active' : ''}" 
                        onclick="setCategory('${cat}')">${cat}</button>
            `).join('');

            const filteredData = currentCategory === '全部' ? vocabCache : vocabCache.filter(item => item.category === currentCategory);

            container.innerHTML = filteredData.map(item => `
                <div class="brutal-box vocab-card">
                    <div class="tape"></div>
                    <div class="flip-container" onclick="this.classList.toggle('is-flipped')">
                        <div class="flip-inner">
                            <div class="flip-front">
                                <div class="cat-badge">${item.category}</div>
                                <h3 class="word-title">${item.word}</h3>
                                <span class="pos-badge">${item.pos}</span>
                                <div class="phonetic">${item.phonetic}</div>
                                <div class="flip-hint">👉 點擊翻面</div>
                            </div>
                            <div class="flip-back">
                                <div class="cat-badge">${item.category}</div>
                                <div class="translation-huge">${item.translation}</div>
                                <div class="flip-hint">👉 點擊翻回</div>
                            </div>
                        </div>
                    </div>
                    <div class="card-actions">
                        <button class="btn-speak" onclick="speakWord(event, '${item.word}')">🔊 PLAY</button>
                        <button class="btn-del" onclick="deleteWord(event, '${item.word}')">✕ DEL</button>
                    </div>
                </div>
            `).join('');
        }

        function setCategory(cat) {
            currentCategory = cat;
            renderCards();
        }

        async function fetchDataFromServer() {
            const container = document.getElementById('vocabContainer');
            container.innerHTML = '<h2 style="grid-column:1/-1; text-align:center; font-size:2rem; padding: 2rem;">雲端同步中... ☁️</h2>';
            try {
                const res = await fetch(GAS_URL);
                const result = await res.json();
                if (result.status === 'success') {
                    vocabCache = result.data.reverse();
                    renderCards();
                }
            } catch (err) { container.innerHTML = '<h2 style="grid-column:1/-1; text-align:center; color:red; font-size:2rem;">讀取失敗 💀</h2>'; }
        }

        // --- 前端字典 API 查詢引擎 ---
        async function fetchDictFrontend(rawWord) {
            let w = rawWord.toLowerCase().trim();
            let pos = "Unknown", ipa = "無音標";
            try {
                let res = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${w}`);
                if (res.ok) {
                    let data = (await res.json())[0];
                    if (data.meanings && data.meanings[0]) pos = data.meanings[0].partOfSpeech;
                    if (data.phonetic) ipa = data.phonetic;
                    else if (data.phonetics) {
                        let p = data.phonetics.find(x => x.text);
                        if (p) ipa = p.text;
                    }
                }
            } catch(e) {}
            if (ipa && ipa !== "無音標") ipa = `/${ipa.replace(/\//g, '')}/`;
            if (pos !== "Unknown") pos = pos.charAt(0).toUpperCase() + pos.slice(1);
            return { word: w, pos: pos, phonetic: ipa };
        }

        // --- 資料寫入邏輯 ---
        async function processText() {
            const text = document.getElementById('article').value;
            const customCategory = document.getElementById('batchCategory').value.trim();
            const btn = document.getElementById('submitBtn');
            if (!text.trim()) return showMsg("⚠️ 內容不能為空！");

            btn.disabled = true; btn.innerText = "🔍 智能萃取中..."; showMsg("⏳ 正在分析單字與詞性...");
            
            const wordsArray = text.toLowerCase().match(/\b[a-z]+\b/g) || [];
            const uniqueWords = [...new Set(wordsArray)];
            if (uniqueWords.length === 0) { btn.disabled = false; btn.innerText = "自動萃取 & 智慧分類"; return showMsg("⚠️ 無有效單字"); }

            const enrichedWords = await Promise.all(uniqueWords.map(async w => {
                const data = await fetchDictFrontend(w);
                data.category = customCategory ? customCategory : autoCategorize(data.word, data.pos);
                return data;
            }));

            try {
                const res = await fetch(GAS_URL, {
                    method: 'POST', body: JSON.stringify({ action: 'save_words', words: enrichedWords }),
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' }
                });
                const result = await res.json();
                if (result.status === 'success') {
                    showMsg(`✅ 成功建立 ${enrichedWords.length} 張翻牌！`);
                    document.getElementById('article').value = '';
                    document.getElementById('batchCategory').value = '';
                    fetchDataFromServer();
                }
            } catch (err) { showMsg("❌ 伺服器連線失敗"); }
            finally { btn.disabled = false; btn.innerText = "自動萃取 & 智慧分類"; }
        }

        async function manualAddWord() {
            const rawWord = document.getElementById('m-word').value;
            if(!rawWord) return alert("單字為必填欄位！");
            
            const btn = document.querySelector('.btn-confirm');
            btn.disabled = true;
            showMsg("⏳ 寫入中...");
            document.getElementById('addModal').style.display = 'none';

            const dictResult = await fetchDictFrontend(rawWord);
            const userPos = document.getElementById('m-pos').value;
            const userIpa = document.getElementById('m-phonetic').value;
            
            dictResult.category = document.getElementById('m-category').value || "自訂單字";
            if (userPos) dictResult.pos = userPos;
            if (userIpa) dictResult.phonetic = userIpa.includes('/') ? userIpa : `/${userIpa}/`;

            try {
                await fetch(GAS_URL, {
                    method: 'POST', 
                    body: JSON.stringify({ action: 'add', ...dictResult, translation: document.getElementById('m-trans').value }),
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' }
                });
                showMsg(`✅ 已新增`);
                document.querySelectorAll('#addModal input').forEach(inp => inp.value = '');
                fetchDataFromServer();
            } catch (err) { showMsg("❌ 新增失敗"); }
            finally { btn.disabled = false; }
        }

        async function deleteWord(event, word) {
            event.stopPropagation(); 
            if(!confirm(`確定要刪除「${word}」嗎？`)) return;
            showMsg(`⏳ 刪除中...`);
            try {
                await fetch(GAS_URL, {
                    method: 'POST', body: JSON.stringify({ action: 'delete', word: word }),
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' }
                });
                showMsg(`✅ 已刪除`);
                fetchDataFromServer();
            } catch (err) { showMsg("❌ 刪除失敗"); }
        }
    </script>
</body>
</html>
