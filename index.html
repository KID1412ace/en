<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔥 EPIC VOCAB | 誇張手帳</title>
    <style>
        /* --- 溫暖誇張調色盤 --- */
        :root {
            --bg-color: #FFF5EB;   /* 溫暖奶油底色 */
            --primary: #FF6B6B;    /* 珊瑚粉紅 */
            --secondary: #FFD166;  /* 暖陽黃 */
            --accent: #118AB2;     /* 對比色：深湖藍 */
            --dark: #073B4C;       /* 溫暖深藍黑 (取代死黑) */
            --border-thick: 6px solid var(--dark);
            --box-shadow-huge: 12px 12px 0px var(--dark);
            --box-shadow-hover: 18px 18px 0px var(--dark);
        }

        body, html { 
            margin: 0; padding: 0; width: 100%; min-height: 100%; 
            font-family: 'Nunito', 'Arial Black', Impact, sans-serif; 
            background-color: var(--bg-color); color: var(--dark); 
            overflow-x: hidden; scroll-behavior: smooth;
            /* 誇張的網點背景 */
            background-image: radial-gradient(rgba(7, 59, 76, 0.15) 3px, transparent 3px);
            background-size: 35px 35px;
        }

        /* --- 誇張動態裝飾物 --- */
        .decor { position: fixed; z-index: 0; pointer-events: none; border: var(--border-thick); box-shadow: 8px 8px 0px var(--dark); }
        .sun {
            width: 200px; height: 200px; background: var(--secondary); border-radius: 50%;
            top: -50px; right: -50px; animation: spin 20s linear infinite;
        }
        .sun::after, .sun::before {
            content: ''; position: absolute; width: 100%; height: 100%;
            border: var(--border-thick); background: transparent; top: -6px; left: -6px;
            animation: pulse 2s infinite alternate;
        }
        .cloud {
            width: 180px; height: 80px; background: #FFF; border-radius: 50px;
            bottom: 10%; left: -20px; animation: floatX 10s infinite alternate ease-in-out;
        }
        .cloud::before {
            content: ''; position: absolute; width: 80px; height: 80px; background: #FFF;
            border-radius: 50%; top: -40px; left: 20px;
        }
        
        @keyframes spin { 100% { transform: rotate(360deg); } }
        @keyframes pulse { 100% { transform: scale(1.2) rotate(15deg); } }
        @keyframes floatX { 0% { transform: translateX(0) translateY(0); } 100% { transform: translateX(100px) translateY(-20px); } }

        /* --- Brutal 共用元素 --- */
        .brutal-box {
            background: #FFF; border: var(--border-thick); border-radius: 16px; 
            box-shadow: var(--box-shadow-huge); position: relative; z-index: 10;
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .brutal-btn {
            background: var(--primary); color: #FFF; border: var(--border-thick);
            padding: 18px 36px; font-size: 1.5rem; font-family: inherit; font-weight: 900;
            border-radius: 12px; box-shadow: 8px 8px 0px var(--dark); cursor: pointer; transition: 0.1s;
            text-transform: uppercase; letter-spacing: 2px;
        }
        .brutal-btn:hover { transform: translate(-4px, -4px); box-shadow: 12px 12px 0px var(--dark); background: var(--secondary); color: var(--dark); }
        .brutal-btn:active { transform: translate(4px, 4px); box-shadow: 2px 2px 0px var(--dark); }

        /* --- 頁面佈局 --- */
        #homePage, #appPage { min-height: 100vh; padding: 4rem 2rem; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; z-index: 10;}
        #appPage { display: none; justify-content: flex-start; padding-top: 2rem;}
        
        .hero-title { font-size: 7rem; font-weight: 900; line-height: 1; color: var(--bg-color); text-shadow: 8px 8px 0px var(--dark), -4px -4px 0px var(--primary); margin: 0; text-align: center; transform: rotate(-3deg); -webkit-text-stroke: 4px var(--dark);}
        .hero-subtitle { font-size: 1.8rem; font-weight: bold; background: var(--accent); color: #FFF; border: var(--border-thick); padding: 10px 25px; border-radius: 50px; transform: rotate(2deg); margin: 30px 0 50px 0; box-shadow: 6px 6px 0px var(--dark);}

        .app-container { width: 100%; max-width: 900px; }
        .nav-bar { display: flex; justify-content: space-between; margin-bottom: 2rem; }
        
        textarea { 
            width: 100%; padding: 25px; margin-bottom: 20px; border: var(--border-thick); border-radius: 16px;
            font-size: 1.6rem; font-weight: bold; resize: vertical; color: var(--dark);
            box-shadow: inset 8px 8px 0px rgba(7, 59, 76, 0.08); box-sizing: border-box; background: #FFF;
            transition: 0.2s; font-family: monospace;
        }
        textarea:focus { outline: none; background: #FFFDF0; border-color: var(--accent); }

        /* --- 單字卡誇張視覺 --- */
        .vocab-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 3rem; margin-top: 2rem; padding-bottom: 6rem;}
        .vocab-card { padding: 2.5rem; display: flex; flex-direction: column; background: #FFF; transform: rotate(-1deg); }
        .vocab-card:nth-child(even) { transform: rotate(1.5deg); }
        .vocab-card:hover { transform: scale(1.05) rotate(0deg) translateY(-10px); box-shadow: var(--box-shadow-hover); z-index: 20;}
        
        /* 溫暖系粗獷膠帶 */
        .tape { position: absolute; top: -20px; left: 50%; transform: translateX(-50%) rotate(-4deg); width: 130px; height: 40px; background: rgba(255, 107, 107, 0.9); border: var(--border-thick); z-index: 2;}
        .vocab-card:nth-child(even) .tape { background: rgba(17, 138, 178, 0.9); transform: translateX(-50%) rotate(4deg); }

        .word-title { font-size: 2.8rem; font-weight: 900; margin: 10px 0 15px 0; color: var(--dark); text-transform: uppercase; border-bottom: 5px solid var(--secondary); display: inline-block;}
        .pos-badge { font-size: 1.3rem; font-weight: bold; padding: 6px 18px; border: 4px solid var(--dark); border-radius: 50px; background: var(--secondary); box-shadow: 4px 4px 0px var(--dark); display: inline-block; margin-bottom: 20px;}
        .phonetic { font-size: 1.6rem; font-family: monospace; font-weight: 900; background: var(--dark); color: #FFF; padding: 8px 15px; border-radius: 8px; display: inline-block; margin-bottom: 25px; transform: skewX(-8deg);}
        .translation { font-size: 1.8rem; font-weight: bold; border-top: 5px dashed var(--dark); padding-top: 25px; margin-top: auto;}

        /* 發音與刪除按鈕 */
        .card-actions { display: flex; gap: 15px; margin-top: 30px; }
        .btn-speak { flex: 2; background: var(--accent); color: #FFF; border: 4px solid var(--dark); border-radius: 12px; font-size: 1.4rem; font-weight: 900; cursor: pointer; padding: 12px; box-shadow: 5px 5px 0px var(--dark); transition: 0.1s;}
        .btn-speak:active { transform: translate(4px, 4px); box-shadow: 1px 1px 0px var(--dark); }
        .btn-del { flex: 1; background: var(--bg-color); color: var(--dark); border: 4px solid var(--dark); border-radius: 12px; font-size: 1.4rem; font-weight: 900; cursor: pointer; box-shadow: 5px 5px 0px var(--dark);}
        .btn-del:active { transform: translate(4px, 4px); box-shadow: 1px 1px 0px var(--dark); }
        
        #status { font-size: 1.8rem; font-weight: 900; background: #FFF; color: var(--dark); padding: 15px 35px; border: var(--border-thick); border-radius: 20px; display: none; position: fixed; top: 40px; left: 50%; transform: translateX(-50%); z-index: 1000; box-shadow: 10px 10px 0px var(--dark); }

        /* Modal */
        #addModal { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(7, 59, 76, 0.8); backdrop-filter: blur(8px); z-index: 2000; justify-content: center; align-items: center;}
        .modal-content { background: var(--secondary); padding: 3.5rem; width: 90%; max-width: 500px; transform: rotate(-1deg); }
        .modal-content input { width: 100%; border: var(--border-thick); border-radius: 12px; font-size: 1.5rem; padding: 15px; margin-bottom: 25px; box-shadow: inset 4px 4px 0px rgba(0,0,0,0.1); box-sizing: border-box; font-family: inherit; font-weight: bold;}
    </style>
</head>
<body>

    <!-- 誇張幾何裝飾 -->
    <div class="decor sun"></div>
    <div class="decor cloud"></div>

    <div id="status">系統訊息</div>

    <!-- 溫暖狂暴主頁 -->
    <div id="homePage">
        <h1 class="hero-title">EPIC<br>VOCAB</h1>
        <div class="hero-subtitle">🚀 視覺衝擊！最強單字手帳 🚀</div>
        <button class="brutal-btn" style="font-size: 2.2rem; padding: 20px 60px;" onclick="switchPage('appPage')">LET'S GET IT ➔</button>
    </div>

    <!-- 系統頁面 -->
    <div id="appPage">
        <div class="app-container">
            <div class="nav-bar">
                <button class="brutal-btn" style="background: #FFF; color: var(--dark);" onclick="switchPage('homePage')">🏠 BACK</button>
                <button class="brutal-btn" style="background: var(--accent); color: #FFF;" onclick="document.getElementById('addModal').style.display='flex'">➕ 手動擴充</button>
            </div>

            <div class="brutal-box" style="padding: 3rem; margin-bottom: 4rem;">
                <h2 style="margin-top:0; font-size: 3rem; font-weight: 900; text-transform: uppercase;">🔥 丟入文章</h2>
                <textarea id="article" rows="4" placeholder="把文章砸進來！後端引擎會幫你搞定 KK 音標。"></textarea>
                <button id="submitBtn" class="brutal-btn" style="width: 100%; font-size: 1.8rem;" onclick="processText()">萃取 & 抓取 KK 音標</button>
            </div>
            
            <div style="display:flex; justify-content:space-between; align-items:flex-end;">
                <h2 style="font-size: 3.5rem; margin-bottom: 0; font-weight: 900;">📚 單字庫</h2>
                <button class="brutal-btn" style="padding: 12px 25px; font-size: 1.4rem; background: var(--secondary); color:var(--dark);" onclick="loadVocabulary()">🔄 刷新</button>
            </div>
            <div id="vocabContainer" class="vocab-grid"></div>
        </div>
    </div>

    <!-- 手動新增 Modal -->
    <div id="addModal">
        <div class="brutal-box modal-content">
            <h2 style="margin-top:0; font-size: 3rem; text-transform: uppercase;">➕ 硬塞單字</h2>
            <input type="text" id="m-word" placeholder="單字 (必填)">
            <input type="text" id="m-pos" placeholder="詞性 (例: n. / v.)">
            <input type="text" id="m-phonetic" placeholder="音標 (例: [æp!])">
            <input type="text" id="m-trans" placeholder="中文翻譯 (必填)">
            <div style="display:flex; gap:20px; margin-top:15px;">
                <button class="brutal-btn" style="background:#FFF; color:var(--dark); flex:1;" onclick="document.getElementById('addModal').style.display='none'">取消</button>
                <button class="brutal-btn" style="flex:1;" onclick="manualAddWord()">確認新增</button>
            </div>
        </div>
    </div>

    <script>
        // ⚠️ 貼上你剛剛發布的「最新版」GAS API 網址
        const GAS_URL = 'https://script.google.com/macros/s/AKfycbw2XJTyDTPHMCvdGe76FXTn8QAtI1SMoEtvM7L4TrJprufqQkamZ5Xdp0OUzs-wZqSG4g/exec'; 

        function switchPage(pageId) {
            document.getElementById('homePage').style.display = 'none';
            document.getElementById('appPage').style.display = 'none';
            document.getElementById(pageId).style.display = 'flex';
            if(pageId === 'appPage') loadVocabulary();
            window.scrollTo(0, 0);
        }

        function showMsg(msg) {
            const el = document.getElementById('status');
            el.innerText = msg; el.style.display = 'block';
            setTimeout(() => { el.style.display = 'none'; }, 3000);
        }

        // --- 🔊 原生發音引擎 ---
        function speakWord(word) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(word);
                utterance.lang = 'en-US';
                utterance.rate = 0.85; 
                utterance.pitch = 1.1;
                window.speechSynthesis.speak(utterance);
            } else {
                alert("瀏覽器不支援發音喔！");
            }
        }

        async function processText() {
            const text = document.getElementById('article').value;
            const btn = document.getElementById('submitBtn');
            if (!text.trim()) return showMsg("⚠️ 文章咧？");

            btn.disabled = true; btn.innerText = "🔍 後端引擎火速爬取中..."; showMsg("⏳ 正在突破防火牆抓取 KK 音標...");
            
            const wordsArray = text.toLowerCase().match(/\b[a-z]+\b/g) || [];
            const uniqueWords = [...new Set(wordsArray)];
            if (uniqueWords.length === 0) { btn.disabled = false; btn.innerText = "萃取 & 抓取 KK 音標"; return showMsg("⚠️ 無有效單字"); }

            try {
                // 將單字陣列直接送交給後端的超強爬蟲引擎
                const res = await fetch(GAS_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'extract', words: uniqueWords }),
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' }
                });
                const result = await res.json();
                if (result.status === 'success') {
                    showMsg(`✅ 成功萃取 ${result.count} 個單字！`);
                    document.getElementById('article').value = '';
                    loadVocabulary();
                }
            } catch (err) { showMsg("❌ 伺服器連線失敗"); }
            finally { btn.disabled = false; btn.innerText = "萃取 & 抓取 KK 音標"; }
        }

        async function manualAddWord() {
            const word = document.getElementById('m-word').value;
            const trans = document.getElementById('m-trans').value;
            if(!word || !trans) return alert("單字跟翻譯給我填好！");

            const payload = {
                action: 'add',
                word: word, pos: document.getElementById('m-pos').value || "未知",
                phonetic: document.getElementById('m-phonetic').value || "無音標",
                translation: trans
            };

            document.getElementById('addModal').style.display = 'none';
            showMsg("⏳ 寫入中...");

            try {
                await fetch(GAS_URL, {
                    method: 'POST', body: JSON.stringify(payload),
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' }
                });
                showMsg(`✅ 已新增 ${word}`);
                document.querySelectorAll('#addModal input').forEach(inp => inp.value = '');
                loadVocabulary();
            } catch (err) { showMsg("❌ 新增失敗"); }
        }

        async function deleteWord(word) {
            if(!confirm(`確定要刪除「${word}」嗎？`)) return;
            showMsg(`⏳ 刪除中...`);
            try {
                await fetch(GAS_URL, {
                    method: 'POST', body: JSON.stringify({ action: 'delete', word: word }),
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' }
                });
                showMsg(`✅ 已刪除`);
                loadVocabulary();
            } catch (err) { showMsg("❌ 刪除失敗"); }
        }

        async function loadVocabulary() {
            const container = document.getElementById('vocabContainer');
            container.innerHTML = '<h2 style="grid-column:1/-1; text-align:center; font-size:3rem;">翻開手帳中... 📖</h2>';

            try {
                const res = await fetch(GAS_URL);
                const result = await res.json();
                if (result.status === 'success') {
                    const data = result.data.reverse();
                    if (data.length === 0) return container.innerHTML = '<h2 style="grid-column:1/-1; text-align:center; font-size:3rem;">空空如也，快點塞字進來！</h2>';

                    container.innerHTML = data.map(item => {
                        let displayPhonetic = item.phonetic;
                        // 自動補齊音標括號
                        if (displayPhonetic !== "無音標" && !displayPhonetic.includes('[')) {
                            displayPhonetic = `[ ${displayPhonetic} ]`;
                        }

                        return `
                        <div class="brutal-box vocab-card">
                            <div class="tape"></div>
                            <div style="display:flex; justify-content:space-between; align-items:flex-start;">
                                <h3 class="word-title">${item.word}</h3>
                            </div>
                            <div><span class="pos-badge">${item.pos}</span></div>
                            <div class="phonetic">${displayPhonetic}</div>
                            <div class="translation">${item.translation}</div>
                            <div class="card-actions">
                                <button class="btn-speak" onclick="speakWord('${item.word}')">🔊 唸給我聽</button>
                                <button class="btn-del" onclick="deleteWord('${item.word}')">✕ 刪除</button>
                            </div>
                        </div>
                        `;
                    }).join('');
                }
            } catch (err) { container.innerHTML = '<h2 style="grid-column:1/-1; text-align:center; color:red; font-size:3rem;">讀取失敗 💀</h2>'; }
        }
    </script>
</body>
</html>
