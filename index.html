<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔥 WARM & WILD VOCAB | 溫暖狂暴單字本</title>
    <style>
        /* --- 溫暖誇張調色盤 --- */
        :root {
            --bg-color: #FFF3E0;   /* 奶油暖白 */
            --primary: #FF6B6B;    /* 蜜桃粉紅 */
            --secondary: #FCA311;  /* 暖陽橘 */
            --tertiary: #4ECDC4;   /* 柔和薄荷綠 (點綴用) */
            --dark: #5D4037;       /* 溫暖深可可色 (取代死黑) */
            --border-thick: 5px solid var(--dark);
            --box-shadow-huge: 12px 12px 0px var(--dark);
            --box-shadow-hover: 20px 20px 0px var(--dark);
        }

        body, html { 
            margin: 0; padding: 0; width: 100%; min-height: 100%; 
            font-family: 'Nunito', 'Arial Black', Impact, sans-serif; 
            background-color: var(--bg-color); color: var(--dark); 
            overflow-x: hidden; scroll-behavior: smooth;
            background-image: radial-gradient(rgba(93, 64, 55, 0.1) 3px, transparent 3px);
            background-size: 30px 30px;
        }

        /* --- 誇張的動態流體裝飾 (Blobs) --- */
        .blob {
            position: fixed; z-index: 0; filter: drop-shadow(10px 10px 0px var(--dark));
            opacity: 0.8; pointer-events: none;
            animation: morph 8s ease-in-out infinite alternate;
        }
        .blob-1 {
            width: 350px; height: 350px; background: var(--primary);
            top: -50px; left: -100px; border: var(--border-thick);
        }
        .blob-2 {
            width: 450px; height: 450px; background: var(--secondary);
            bottom: -150px; right: -100px; border: var(--border-thick);
            animation-delay: -2s; animation-duration: 10s;
        }
        .blob-3 {
            width: 200px; height: 200px; background: var(--tertiary);
            top: 20%; right: 10%; border: var(--border-thick);
            animation-delay: -4s;
        }
        
        @keyframes morph {
            0% { border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%; transform: rotate(0deg) scale(1); }
            50% { border-radius: 30% 60% 70% 40% / 50% 60% 30% 60%; transform: rotate(10deg) scale(1.05); }
            100% { border-radius: 40% 50% 30% 60% / 40% 40% 60% 50%; transform: rotate(-10deg) scale(0.95); }
        }

        /* --- 共用溫暖粗獷元件 --- */
        .brutal-box {
            background: #FFF; border: var(--border-thick); border-radius: 20px; 
            box-shadow: var(--box-shadow-huge); position: relative; z-index: 10;
            transition: all 0.2s ease;
        }
        .brutal-btn {
            background: var(--primary); color: #FFF; border: var(--border-thick);
            padding: 16px 32px; font-size: 1.4rem; font-family: inherit; font-weight: 900;
            border-radius: 15px; box-shadow: 8px 8px 0px var(--dark); cursor: pointer; transition: 0.1s;
        }
        .brutal-btn:hover { transform: translate(-4px, -4px); box-shadow: 12px 12px 0px var(--dark); background: var(--secondary); color: var(--dark); }
        .brutal-btn:active { transform: translate(4px, 4px); box-shadow: 2px 2px 0px var(--dark); }

        /* --- 頁面佈局 --- */
        #homePage, #appPage { min-height: 100vh; padding: 4rem 2rem; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; z-index: 10;}
        #appPage { display: none; justify-content: flex-start; padding-top: 2rem;}
        
        .hero-title { font-size: 6.5rem; font-weight: 900; line-height: 1; color: var(--bg-color); text-shadow: 6px 6px 0px var(--dark), -3px -3px 0px var(--primary); margin: 0; text-align: center; transform: rotate(-2deg); -webkit-text-stroke: 3px var(--dark);}
        .hero-subtitle { font-size: 1.8rem; font-weight: bold; background: var(--secondary); color: var(--dark); border: var(--border-thick); padding: 10px 25px; border-radius: 10px; transform: rotate(2deg); margin: 30px 0 50px 0; box-shadow: 6px 6px 0px var(--dark);}

        .app-container { width: 100%; max-width: 900px; }
        .nav-bar { display: flex; justify-content: space-between; margin-bottom: 2rem; }
        
        textarea { 
            width: 100%; padding: 20px; margin-bottom: 20px; border: var(--border-thick); border-radius: 15px;
            font-size: 1.5rem; font-weight: bold; resize: vertical; color: var(--dark);
            box-shadow: inset 5px 5px 0px rgba(93, 64, 55, 0.05); box-sizing: border-box; background: #FFF;
            transition: 0.2s;
        }
        textarea:focus { outline: none; background: #FFF9F0; border-color: var(--secondary); }

        /* --- 單字卡誇張視覺 --- */
        .vocab-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 2.5rem; margin-top: 2rem; padding-bottom: 5rem;}
        .vocab-card { padding: 2rem; display: flex; flex-direction: column; background: #FFF; transform: rotate(-1deg); }
        .vocab-card:nth-child(even) { transform: rotate(1deg); }
        .vocab-card:hover { transform: scale(1.03) rotate(0deg) translateY(-10px); box-shadow: var(--box-shadow-hover); z-index: 20;}
        
        /* 溫暖系便條膠帶 */
        .tape { position: absolute; top: -15px; left: 50%; transform: translateX(-50%) rotate(-3deg); width: 120px; height: 35px; background: rgba(78, 205, 196, 0.9); border: 3px solid var(--dark); z-index: 2;}
        .vocab-card:nth-child(even) .tape { background: rgba(255, 107, 107, 0.9); transform: translateX(-50%) rotate(3deg); }

        .word-title { font-size: 2.5rem; font-weight: 900; margin: 15px 0 10px 0; color: var(--dark); text-transform: capitalize;}
        .pos-badge { font-size: 1.2rem; font-weight: bold; padding: 5px 15px; border: 3px solid var(--dark); border-radius: 12px; background: var(--secondary); box-shadow: 3px 3px 0px var(--dark); display: inline-block; margin-bottom: 15px;}
        .phonetic { font-size: 1.4rem; font-family: 'Courier New', Courier, monospace; font-weight: 900; background: var(--dark); color: var(--bg-color); padding: 5px 15px; border-radius: 8px; display: inline-block; margin-bottom: 20px; transform: skewX(-5deg);}
        .translation { font-size: 1.6rem; font-weight: bold; border-top: 4px dashed var(--dark); padding-top: 20px; margin-top: auto;}

        /* 發音與刪除按鈕 */
        .card-actions { display: flex; gap: 10px; margin-top: 25px; }
        .btn-speak { flex: 2; background: var(--tertiary); color: var(--dark); border: 3px solid var(--dark); border-radius: 12px; font-size: 1.2rem; font-weight: 900; cursor: pointer; padding: 10px; box-shadow: 4px 4px 0px var(--dark); transition: 0.1s;}
        .btn-speak:active { transform: translate(3px, 3px); box-shadow: 1px 1px 0px var(--dark); }
        .btn-del { flex: 1; background: var(--primary); color: white; border: 3px solid var(--dark); border-radius: 12px; font-size: 1.2rem; font-weight: 900; cursor: pointer; box-shadow: 4px 4px 0px var(--dark);}
        .btn-del:active { transform: translate(3px, 3px); box-shadow: 1px 1px 0px var(--dark); }
        
        #status { font-size: 1.5rem; font-weight: bold; background: #FFF; color: var(--dark); padding: 15px 30px; border: var(--border-thick); border-radius: 15px; display: none; position: fixed; top: 30px; left: 50%; transform: translateX(-50%); z-index: 1000; box-shadow: 8px 8px 0px var(--dark); }

        /* Modal */
        #addModal { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(93, 64, 55, 0.7); backdrop-filter: blur(5px); z-index: 2000; justify-content: center; align-items: center;}
        .modal-content { background: var(--bg-color); padding: 3rem; width: 90%; max-width: 450px; transform: rotate(-1deg); }
        .modal-content input { width: 100%; border: var(--border-thick); border-radius: 10px; font-size: 1.3rem; padding: 12px; margin-bottom: 20px; box-shadow: inset 3px 3px 0px rgba(0,0,0,0.05); box-sizing: border-box; font-family: inherit;}
    </style>
</head>
<body>

    <!-- 誇張流體裝飾 -->
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>

    <div id="status">系統訊息</div>

    <!-- 溫暖狂暴主頁 -->
    <div id="homePage">
        <h1 class="hero-title">WARM<br>VOCAB</h1>
        <div class="hero-subtitle">✨ 有溫度的超狂單字手帳 ✨</div>
        <button class="brutal-btn" style="font-size: 2rem; padding: 15px 50px;" onclick="switchPage('appPage')">開啟手帳 ➔</button>
    </div>

    <!-- 系統頁面 -->
    <div id="appPage">
        <div class="app-container">
            <div class="nav-bar">
                <button class="brutal-btn" style="background: #FFF; color: var(--dark);" onclick="switchPage('homePage')">🏠 返回主頁</button>
                <button class="brutal-btn" style="background: var(--tertiary); color: var(--dark);" onclick="document.getElementById('addModal').style.display='flex'">➕ 暴力擴充</button>
            </div>

            <div class="brutal-box" style="padding: 2.5rem; margin-bottom: 3rem;">
                <h2 style="margin-top:0; font-size: 2.5rem; font-weight: 900;">🔥 丟入文章</h2>
                <textarea id="article" rows="4" placeholder="貼上英文，幫你精準抓出 KK 音標與詞性！"></textarea>
                <button id="submitBtn" class="brutal-btn" style="width: 100%; font-size: 1.6rem;" onclick="processText()">萃取 & 抓取 KK 音標</button>
            </div>
            
            <div style="display:flex; justify-content:space-between; align-items:flex-end;">
                <h2 style="font-size: 3rem; margin-bottom: 0; font-weight: 900;">📚 我的單字盒</h2>
                <button class="brutal-btn" style="padding: 10px 20px; font-size: 1.2rem; background: var(--secondary); color:var(--dark);" onclick="loadVocabulary()">🔄 重新整理</button>
            </div>
            <div id="vocabContainer" class="vocab-grid"></div>
        </div>
    </div>

    <!-- 手動新增 Modal -->
    <div id="addModal">
        <div class="brutal-box modal-content">
            <h2 style="margin-top:0; font-size: 2.5rem;">➕ 手動擴充</h2>
            <input type="text" id="m-word" placeholder="單字 (必填)">
            <input type="text" id="m-pos" placeholder="詞性 (例: n. / v.)">
            <input type="text" id="m-phonetic" placeholder="音標 (例: [æp!])">
            <input type="text" id="m-trans" placeholder="中文翻譯 (必填)">
            <div style="display:flex; gap:15px; margin-top:10px;">
                <button class="brutal-btn" style="background:#FFF; color:var(--dark); flex:1;" onclick="document.getElementById('addModal').style.display='none'">取消</button>
                <button class="brutal-btn" style="flex:1;" onclick="manualAddWord()">硬塞進去</button>
            </div>
        </div>
    </div>

    <script>
        // ⚠️ 貼上你的 GAS API 網址，後端完全不用動
        const GAS_URL = 'https://script.google.com/macros/s/AKfycbw2XJTyDTPHMCvdGe76FXTn8QAtI1SMoEtvM7L4TrJprufqQkamZ5Xdp0OUzs-wZqSG4g/exec'; 

        function switchPage(pageId) {
            document.getElementById('homePage').style.display = 'none';
            document.getElementById('appPage').style.display = 'none';
            document.getElementById(pageId).style.display = 'flex';
            if(pageId === 'appPage') loadVocabulary();
            window.scrollTo(0, 0);
        }

        function showMsg(msg) {
            const el = document.getElementById('status');
            el.innerText = msg; el.style.display = 'block';
            setTimeout(() => { el.style.display = 'none'; }, 3000);
        }

        // --- 🔊 原生發音引擎 ---
        function speakWord(word) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(word);
                utterance.lang = 'en-US';
                utterance.rate = 0.85; 
                window.speechSynthesis.speak(utterance);
            } else {
                alert("瀏覽器不支援發音喔！");
            }
        }

        // --- 🕷️ 終極大絕招：前端跨域代理爬蟲 (CORS Proxy + Yahoo 字典) ---
        async function fetchYahooDict(word) {
            try {
                // 利用 allorigins 代理伺服器繞過 CORS 與 IP 阻擋
                const targetUrl = 'https://tw.dictionary.search.yahoo.com/search?p=' + encodeURIComponent(word);
                const proxyUrl = 'https://api.allorigins.win/get?url=' + encodeURIComponent(targetUrl);
                
                const response = await fetch(proxyUrl);
                if (response.ok) {
                    const data = await response.json();
                    const html = data.contents; // 取得 Yahoo 字典的 HTML 原始碼

                    let phonetic = "無音標";
                    let pos = "未知";

                    // 1. 利用 Regex 抓取最正宗的 KK 音標
                    const kkMatch = html.match(/KK\[(.*?)\]/);
                    if (kkMatch) {
                        phonetic = 'KK [' + kkMatch[1] + ']';
                    } else {
                        // 備用：有時候 Yahoo 會顯示 DJ 音標
                        const djMatch = html.match(/DJ\[(.*?)\]/);
                        if (djMatch) phonetic = 'DJ [' + djMatch[1] + ']';
                    }

                    // 2. 利用 Regex 抓取精準詞性 (Yahoo 通常標示為 pos_button)
                    const posMatch = html.match(/class="[^"]*pos_button[^"]*"[^>]*>([^<]+)/i);
                    if (posMatch && posMatch[1]) {
                        pos = posMatch[1].trim(); 
                    }

                    return { word: word, pos: pos, phonetic: phonetic };
                }
            } catch(e) {
                console.error("爬蟲失敗:", e);
            }
            return { word: word, pos: "未知", phonetic: "無音標" };
        }

        async function processText() {
            const text = document.getElementById('article').value;
            const btn = document.getElementById('submitBtn');
            if (!text.trim()) return showMsg("⚠️ 文章咧？");

            btn.disabled = true; btn.innerText = "🔍 潛入 Yahoo 字典爬取中..."; showMsg("⏳ 正在利用代理伺服器抓取 KK 音標...");
            
            const wordsArray = text.toLowerCase().match(/\b[a-z]+\b/g) || [];
            const uniqueWords = [...new Set(wordsArray)];
            if (uniqueWords.length === 0) { btn.disabled = false; btn.innerText = "萃取 & 抓取 KK 音標"; return showMsg("⚠️ 無有效單字"); }

            // 啟動前端平行爬蟲，直接抓取 Yahoo
            const enrichedWords = await Promise.all(uniqueWords.map(w => fetchYahooDict(w)));

            try {
                btn.innerText = "💾 寫入雲端資料庫...";
                const res = await fetch(GAS_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'save_extracted', words: enrichedWords }),
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' }
                });
                const result = await res.json();
                if (result.status === 'success') {
                    showMsg(`✅ 成功搞定 ${uniqueWords.length} 個單字，包含 KK 音標！`);
                    document.getElementById('article').value = '';
                    loadVocabulary();
                }
            } catch (err) { showMsg("❌ 伺服器連線失敗"); }
            finally { btn.disabled = false; btn.innerText = "萃取 & 抓取 KK 音標"; }
        }

        async function manualAddWord() {
            const word = document.getElementById('m-word').value;
            const trans = document.getElementById('m-trans').value;
            if(!word || !trans) return alert("單字跟翻譯給我填好！");

            const payload = {
                action: 'add',
                words: [{
                    word: word, pos: document.getElementById('m-pos').value || "未知",
                    phonetic: document.getElementById('m-phonetic').value || "無音標"
                }]
            };

            document.getElementById('addModal').style.display = 'none';
            showMsg("⏳ 寫入中...");

            try {
                await fetch(GAS_URL, {
                    method: 'POST', body: JSON.stringify(payload),
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' }
                });
                showMsg(`✅ 已新增 ${word}`);
                document.querySelectorAll('#addModal input').forEach(inp => inp.value = '');
                loadVocabulary();
            } catch (err) { showMsg("❌ 新增失敗"); }
        }

        async function deleteWord(word) {
            if(!confirm(`確定要刪除「${word}」嗎？`)) return;
            showMsg(`⏳ 刪除中...`);
            try {
                await fetch(GAS_URL, {
                    method: 'POST', body: JSON.stringify({ action: 'delete', word: word }),
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' }
                });
                showMsg(`✅ 已刪除`);
                loadVocabulary();
            } catch (err) { showMsg("❌ 刪除失敗"); }
        }

        async function loadVocabulary() {
            const container = document.getElementById('vocabContainer');
            container.innerHTML = '<h2 style="grid-column:1/-1; text-align:center; font-size:2.5rem;">翻開手帳中... 📖</h2>';

            try {
                const res = await fetch(GAS_URL);
                const result = await res.json();
                if (result.status === 'success') {
                    const data = result.data.reverse();
                    if (data.length === 0) return container.innerHTML = '<h2 style="grid-column:1/-1; text-align:center; font-size:2.5rem;">空空如也，快點塞字進來！</h2>';

                    container.innerHTML = data.map(item => {
                        let displayPhonetic = item.phonetic;
                        // 如果是手動新增且沒有加上括號，自動補上
                        if (displayPhonetic !== "無音標" && !displayPhonetic.includes('[')) {
                            displayPhonetic = `[ ${displayPhonetic} ]`;
                        }

                        return `
                        <div class="brutal-box vocab-card">
                            <div class="tape"></div>
                            <div style="display:flex; justify-content:space-between; align-items:flex-start;">
                                <h3 class="word-title">${item.word}</h3>
                            </div>
                            <div><span class="pos-badge">${item.pos}</span></div>
                            <div class="phonetic">${displayPhonetic}</div>
                            <div class="translation">${item.translation}</div>
                            <div class="card-actions">
                                <button class="btn-speak" onclick="speakWord('${item.word}')">🔊 唸給我聽</button>
                                <button class="btn-del" onclick="deleteWord('${item.word}')">✕ 刪除</button>
                            </div>
                        </div>
                        `;
                    }).join('');
                }
            } catch (err) { container.innerHTML = '<h2 style="grid-column:1/-1; text-align:center; color:red; font-size:2.5rem;">讀取失敗 💀</h2>'; }
        }
    </script>
</body>
</html>
