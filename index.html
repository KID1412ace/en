<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔥 WILD VOCAB | 狂暴單字庫</title>
    <style>
        /* --- 誇張螢光調色盤 --- */
        :root {
            --bg-color: #E0FF4F; /* 螢光黃 */
            --primary: #FF007F;  /* 死亡芭比粉 */
            --secondary: #00F0FF;/* 亮藍色 */
            --dark: #090909;     /* 極致黑 */
            --border-thick: 6px solid var(--dark);
            --box-shadow-huge: 15px 15px 0px var(--dark);
            --box-shadow-hover: 25px 25px 0px var(--dark);
        }

        body, html { 
            margin: 0; padding: 0; width: 100%; min-height: 100%; 
            font-family: 'Arial Black', Impact, sans-serif; 
            background-color: var(--bg-color); color: var(--dark); 
            overflow-x: hidden; scroll-behavior: smooth;
            /* 誇張的普普風網點背景 */
            background-image: radial-gradient(var(--dark) 2px, transparent 2px);
            background-size: 30px 30px;
        }

        /* --- 瘋狂跑馬燈 --- */
        .marquee {
            width: 100vw; background: var(--dark); color: var(--bg-color);
            padding: 10px 0; font-size: 2rem; font-weight: 900; letter-spacing: 5px;
            white-space: nowrap; overflow: hidden; position: fixed; top: 0; z-index: 1000;
            border-bottom: var(--border-thick);
        }
        .marquee span { display: inline-block; animation: scrollText 10s linear infinite; }
        @keyframes scrollText { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }

        /* --- 兩側超誇張動態物件 --- */
        .wild-shape { position: fixed; z-index: 0; pointer-events: none; border: var(--border-thick); box-shadow: 10px 10px 0px var(--dark); }
        .shape-star { width: 150px; height: 150px; background: var(--primary); top: 20%; left: -30px; clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%); animation: spin 8s linear infinite; }
        .shape-circle { width: 200px; height: 200px; background: var(--secondary); bottom: 10%; right: -50px; border-radius: 50%; animation: pulseSize 2s infinite alternate; }
        .shape-zigzag { width: 120px; height: 120px; background: #FF9F1C; top: 15%; right: 5%; clip-path: polygon(20% 0%, 0% 20%, 30% 50%, 0% 80%, 20% 100%, 50% 70%, 80% 100%, 100% 80%, 70% 50%, 100% 20%, 80% 0%, 50% 30%); animation: spin-reverse 6s linear infinite; }
        .shape-pill { width: 80px; height: 200px; background: #BA55D3; bottom: 20%; left: 5%; border-radius: 50px; animation: floatWild 3s infinite alternate ease-in-out; }
        
        @keyframes spin { 100% { transform: rotate(360deg); } }
        @keyframes spin-reverse { 100% { transform: rotate(-360deg); } }
        @keyframes pulseSize { 0% { transform: scale(1) rotate(0deg); } 100% { transform: scale(1.3) rotate(15deg); } }
        @keyframes floatWild { 0% { transform: translateY(0) skewX(-10deg); } 100% { transform: translateY(-50px) skewX(10deg); } }

        /* --- Brutal 共用元素 --- */
        .brutal-box {
            background: #FFF; border: var(--border-thick); border-radius: 0px; 
            box-shadow: var(--box-shadow-huge); position: relative; z-index: 10;
            transition: 0.1s;
        }
        .brutal-btn {
            background: var(--primary); color: #FFF; border: var(--border-thick);
            padding: 16px 32px; font-size: 1.5rem; font-family: inherit; text-transform: uppercase;
            box-shadow: 10px 10px 0px var(--dark); cursor: pointer; transition: 0.1s; outline: none;
        }
        .brutal-btn:hover { transform: translate(-4px, -4px); box-shadow: var(--box-shadow-hover); background: var(--secondary); color: var(--dark); }
        .brutal-btn:active { transform: translate(6px, 6px); box-shadow: 2px 2px 0px var(--dark); }

        /* --- 頁面佈局 --- */
        #homePage, #appPage { min-height: 100vh; padding: 6rem 2rem 2rem 2rem; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; z-index: 10;}
        #appPage { display: none; justify-content: flex-start; }
        
        .hero-title { font-size: 8rem; line-height: 0.9; color: var(--bg-color); text-shadow: 8px 8px 0px var(--dark), -4px -4px 0px var(--primary); margin: 0; text-align: center; transform: rotate(-3deg); -webkit-text-stroke: 4px var(--dark);}
        .hero-subtitle { font-size: 2.5rem; background: var(--secondary); color: var(--dark); border: var(--border-thick); padding: 10px 20px; transform: rotate(2deg); margin: 30px 0 50px 0; box-shadow: 8px 8px 0px var(--dark);}

        .app-container { width: 100%; max-width: 900px; }
        .nav-bar { display: flex; justify-content: space-between; margin-bottom: 3rem; }
        
        textarea { 
            width: 100%; padding: 20px; margin-bottom: 20px; border: var(--border-thick); 
            font-size: 1.5rem; font-family: 'Courier New', Courier, monospace; font-weight: bold; resize: vertical; 
            box-shadow: inset 8px 8px 0px rgba(0,0,0,0.1); box-sizing: border-box; background: #F4F4F4;
        }
        textarea:focus { outline: none; background: #FFF; border-color: var(--primary); }

        /* --- 單字卡視覺 --- */
        .vocab-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 3rem; margin-top: 3rem; padding-bottom: 5rem;}
        .vocab-card { padding: 2rem; display: flex; flex-direction: column; background: #FFF; transform: rotate(-1deg); }
        .vocab-card:nth-child(even) { transform: rotate(1deg); }
        .vocab-card:hover { transform: scale(1.05) rotate(0deg); box-shadow: var(--box-shadow-hover); z-index: 20;}
        
        /* 膠帶設計 */
        .tape { position: absolute; top: -15px; left: 50%; transform: translateX(-50%) rotate(-2deg); width: 140px; height: 40px; background: rgba(255, 0, 127, 0.8); border: var(--border-thick); z-index: 2;}
        .vocab-card:nth-child(even) .tape { background: rgba(0, 240, 255, 0.8); transform: translateX(-50%) rotate(3deg); }

        .word-title { font-size: 2.8rem; margin: 15px 0 10px 0; text-transform: uppercase; letter-spacing: 2px;}
        .pos-badge { font-size: 1.2rem; padding: 5px 15px; border: var(--border-thick); background: var(--bg-color); box-shadow: 4px 4px 0px var(--dark); display: inline-block; margin-bottom: 15px;}
        .phonetic { font-size: 1.4rem; font-family: 'Courier New', Courier, monospace; background: var(--dark); color: #FFF; padding: 5px 10px; display: inline-block; margin-bottom: 20px; transform: skewX(-10deg);}
        .translation { font-size: 1.8rem; border-top: 6px dashed var(--dark); padding-top: 20px; margin-top: auto;}

        /* 發音與刪除按鈕 */
        .card-actions { display: flex; gap: 15px; margin-top: 25px; }
        .btn-speak { flex: 2; background: var(--secondary); color: var(--dark); border: var(--border-thick); font-size: 1.5rem; font-family: inherit; cursor: pointer; padding: 10px; box-shadow: 6px 6px 0px var(--dark); transition: 0.1s;}
        .btn-speak:active { transform: translate(4px, 4px); box-shadow: 2px 2px 0px var(--dark); }
        .btn-del { flex: 1; background: var(--primary); color: white; border: var(--border-thick); font-size: 1.5rem; cursor: pointer; box-shadow: 6px 6px 0px var(--dark);}
        .btn-del:active { transform: translate(4px, 4px); box-shadow: 2px 2px 0px var(--dark); }
        
        #status { font-size: 2rem; background: var(--bg-color); color: var(--dark); padding: 15px 30px; border: var(--border-thick); display: none; position: fixed; top: 80px; left: 50%; transform: translateX(-50%); z-index: 1000; box-shadow: 10px 10px 0px var(--dark); animation: shake 0.5s infinite;}
        @keyframes shake { 0% { transform: translateX(-50%) rotate(-2deg); } 50% { transform: translateX(-50%) rotate(2deg); } 100% { transform: translateX(-50%) rotate(-2deg); } }

        /* Modal */
        #addModal { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(9, 9, 9, 0.9); z-index: 2000; justify-content: center; align-items: center;}
        .modal-content { background: var(--secondary); padding: 3rem; width: 90%; max-width: 500px; transform: rotate(-1deg); }
        .modal-content input { width: 100%; border: var(--border-thick); font-size: 1.5rem; padding: 15px; margin-bottom: 20px; box-shadow: inset 4px 4px 0px rgba(0,0,0,0.1); box-sizing: border-box; font-family: inherit;}
    </style>
</head>
<body>

    <div class="marquee">
        <span>⚠️ EXTREME VOCABULARY GENERATOR 🔥 NO EXCUSES JUST LEARN ⚠️ 狂暴單字引擎啟動 🔥 </span>
    </div>

    <!-- 誇張幾何漂浮物 -->
    <div class="wild-shape shape-star"></div>
    <div class="wild-shape shape-circle"></div>
    <div class="wild-shape shape-zigzag"></div>
    <div class="wild-shape shape-pill"></div>

    <div id="status">系統訊息</div>

    <!-- 狂暴主頁 -->
    <div id="homePage">
        <h1 class="hero-title">WILD<br>VOCAB</h1>
        <div class="hero-subtitle">⚡ 全宇宙最狂的單字外掛 ⚡</div>
        <button class="brutal-btn" style="font-size: 2.5rem; padding: 20px 60px;" onclick="switchPage('appPage')">LET'S START ➔</button>
    </div>

    <!-- 系統頁面 -->
    <div id="appPage">
        <div class="app-container">
            <div class="nav-bar">
                <button class="brutal-btn" style="background: #FFF; color: var(--dark);" onclick="switchPage('homePage')">🏠 BACK</button>
                <button class="brutal-btn" style="background: var(--bg-color); color: var(--dark);" onclick="document.getElementById('addModal').style.display='flex'">➕ 暴力新增</button>
            </div>

            <div class="brutal-box" style="padding: 3rem; margin-bottom: 4rem;">
                <h2 style="margin-top:0; font-size: 3rem; text-transform: uppercase;">🔥 丟文章進來</h2>
                <textarea id="article" rows="5" placeholder="把看不懂的英文全部砸在這邊！"></textarea>
                <button id="submitBtn" class="brutal-btn" style="width: 100%; font-size: 2rem;" onclick="processText()">萃取 & 雙核心查音標</button>
            </div>
            
            <div style="display:flex; justify-content:space-between; align-items:flex-end;">
                <h2 style="font-size: 3.5rem; margin-bottom: 0;">📚 戰利品</h2>
                <button class="brutal-btn" style="padding: 10px 20px; font-size: 1.2rem; background: var(--secondary); color:var(--dark);" onclick="loadVocabulary()">🔄 刷新</button>
            </div>
            <div id="vocabContainer" class="vocab-grid"></div>
        </div>
    </div>

    <!-- 暴力新增 Modal -->
    <div id="addModal">
        <div class="brutal-box modal-content">
            <h2 style="margin-top:0; font-size: 3rem;">➕ 手動擴充</h2>
            <input type="text" id="m-word" placeholder="單字 (必填)">
            <input type="text" id="m-pos" placeholder="詞性">
            <input type="text" id="m-phonetic" placeholder="音標">
            <input type="text" id="m-trans" placeholder="中文翻譯 (必填)">
            <div style="display:flex; gap:20px; margin-top:20px;">
                <button class="brutal-btn" style="background:#FFF; color:var(--dark); flex:1;" onclick="document.getElementById('addModal').style.display='none'">取消</button>
                <button class="brutal-btn" style="flex:1;" onclick="manualAddWord()">硬塞進去</button>
            </div>
        </div>
    </div>

    <script>
        // ⚠️ 貼上你的 GAS API 網址，後端程式碼「完全不用改」
        const GAS_URL = 'https://script.google.com/macros/s/AKfycbw2XJTyDTPHMCvdGe76FXTn8QAtI1SMoEtvM7L4TrJprufqQkamZ5Xdp0OUzs-wZqSG4g/exec'; 

        function switchPage(pageId) {
            document.getElementById('homePage').style.display = 'none';
            document.getElementById('appPage').style.display = 'none';
            document.getElementById(pageId).style.display = 'flex';
            if(pageId === 'appPage') loadVocabulary();
            window.scrollTo(0, 0);
        }

        function showMsg(msg) {
            const el = document.getElementById('status');
            el.innerText = msg; el.style.display = 'block';
            setTimeout(() => { el.style.display = 'none'; }, 3000);
        }

        // --- 🔊 狂暴發音引擎 ---
        function speakWord(word) {
            if ('speechSynthesis' in window) {
                // 每次發音前先中斷上一個發音，避免連續點擊卡住
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(word);
                utterance.lang = 'en-US';
                utterance.rate = 0.85; // 放慢一點聽得比較清楚
                utterance.pitch = 1.1;
                window.speechSynthesis.speak(utterance);
            } else {
                alert("換個瀏覽器吧，這台不會講話！");
            }
        }

        // --- 🤖 雙核心查詢引擎 (Datamuse + Free Dictionary) ---
        async function fetchDictFrontend(originalWord) {
            let pos = "未知";
            let phonetic = "";
            let wordSearch = originalWord.toLowerCase();

            // 核心 1：先使用 Datamuse API (這傢伙抓音標超強，各種過去式複數型態都能抓)
            try {
                const res = await fetch(`https://api.datamuse.com/words?sp=${wordSearch}&md=r&ipa=1&max=1`);
                if (res.ok) {
                    const data = await res.json();
                    if (data.length > 0 && data[0].tags) {
                        const ipaTag = data[0].tags.find(tag => tag.startsWith('ipa_pron:'));
                        if (ipaTag) phonetic = "/" + ipaTag.replace('ipa_pron:', '') + "/";
                        
                        // 順便看看有沒有詞性
                        const posTag = data[0].tags.find(tag => ['n', 'v', 'adj', 'adv'].includes(tag));
                        if(posTag) {
                            if(posTag==='n') pos='noun'; if(posTag==='v') pos='verb';
                            if(posTag==='adj') pos='adjective'; if(posTag==='adv') pos='adverb';
                        }
                    }
                }
            } catch(e) {}

            // 核心 2：如果詞性或音標有缺，啟動字根還原，呼叫 Free Dictionary API 補強
            if (pos === "未知" || phonetic === "") {
                const variations = [wordSearch];
                if (wordSearch.endsWith('ies')) variations.push(wordSearch.slice(0, -3) + 'y');
                if (wordSearch.endsWith('es')) variations.push(wordSearch.slice(0, -2));
                if (wordSearch.endsWith('s')) variations.push(wordSearch.slice(0, -1));
                if (wordSearch.endsWith('ing')) { variations.push(wordSearch.slice(0, -3)); variations.push(wordSearch.slice(0, -3) + 'e'); }
                if (wordSearch.endsWith('ed')) { variations.push(wordSearch.slice(0, -2)); variations.push(wordSearch.slice(0, -1)); }

                for (let w of variations) {
                    try {
                        const res = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${w}`);
                        if (res.ok) {
                            const data = (await res.json())[0];
                            if (pos === "未知" && data.meanings && data.meanings.length > 0) pos = data.meanings[0].partOfSpeech;
                            if (phonetic === "") {
                                if (data.phonetic) phonetic = data.phonetic;
                                else if (data.phonetics) {
                                    const p = data.phonetics.find(item => item.text);
                                    if (p) phonetic = p.text;
                                }
                            }
                            if (pos !== "未知" && phonetic !== "") break; // 都找到了就提早結束
                        }
                    } catch(e) {}
                }
            }
            return { word: originalWord, pos: pos, phonetic: phonetic || "無音標" };
        }

        async function processText() {
            const text = document.getElementById('article').value;
            const btn = document.getElementById('submitBtn');
            if (!text.trim()) return showMsg("⚠️ 喂！文章呢？");

            btn.disabled = true; btn.innerText = "🔍 雙核心查字典中..."; showMsg("⏳ 啟動超級爬蟲引擎...");
            
            const wordsArray = text.toLowerCase().match(/\b[a-z]+\b/g) || [];
            const uniqueWords = [...new Set(wordsArray)];
            if (uniqueWords.length === 0) { btn.disabled = false; btn.innerText = "萃取 & 雙核心查音標"; return showMsg("⚠️ 無有效單字"); }

            const enrichedWords = await Promise.all(uniqueWords.map(w => fetchDictFrontend(w)));

            try {
                btn.innerText = "💾 狂暴寫入資料庫...";
                const res = await fetch(GAS_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'save_extracted', words: enrichedWords }),
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' }
                });
                const result = await res.json();
                if (result.status === 'success') {
                    showMsg(`✅ 爽啦！成功搞定 ${uniqueWords.length} 個單字`);
                    document.getElementById('article').value = '';
                    loadVocabulary();
                }
            } catch (err) { showMsg("❌ 伺服器被你弄壞了"); }
            finally { btn.disabled = false; btn.innerText = "萃取 & 雙核心查音標"; }
        }

        async function manualAddWord() {
            const word = document.getElementById('m-word').value;
            const trans = document.getElementById('m-trans').value;
            if(!word || !trans) return alert("單字跟翻譯給我填好！");

            const payload = {
                action: 'add',
                words: [{
                    word: word, pos: document.getElementById('m-pos').value || "未知",
                    phonetic: document.getElementById('m-phonetic').value || "無音標"
                }]
            };

            document.getElementById('addModal').style.display = 'none';
            showMsg("⏳ 暴力塞入中...");

            try {
                await fetch(GAS_URL, {
                    method: 'POST', body: JSON.stringify(payload),
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' }
                });
                showMsg(`✅ 已新增 ${word}`);
                document.querySelectorAll('#addModal input').forEach(inp => inp.value = '');
                loadVocabulary();
            } catch (err) { showMsg("❌ 新增失敗"); }
        }

        async function deleteWord(word) {
            if(!confirm(`確定要把「${word}」轟出去嗎？`)) return;
            showMsg(`⏳ 摧毀中...`);
            try {
                await fetch(GAS_URL, {
                    method: 'POST', body: JSON.stringify({ action: 'delete', word: word }),
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' }
                });
                showMsg(`✅ 已刪除`);
                loadVocabulary();
            } catch (err) { showMsg("❌ 刪除失敗"); }
        }

        async function loadVocabulary() {
            const container = document.getElementById('vocabContainer');
            container.innerHTML = '<h2 style="grid-column:1/-1; text-align:center; font-size:3rem;">載入中... 🏃‍♂️💨</h2>';

            try {
                const res = await fetch(GAS_URL);
                const result = await res.json();
                if (result.status === 'success') {
                    const data = result.data.reverse();
                    if (data.length === 0) return container.innerHTML = '<h2 style="grid-column:1/-1; text-align:center; font-size:3rem;">空空如也，快點塞字進來！</h2>';

                    container.innerHTML = data.map(item => {
                        let displayPhonetic = item.phonetic;
                        if (displayPhonetic !== "無音標" && !displayPhonetic.startsWith('[') && !displayPhonetic.startsWith('/')) {
                            displayPhonetic = `[ ${displayPhonetic} ]`;
                        }

                        return `
                        <div class="brutal-box vocab-card">
                            <div class="tape"></div>
                            <div style="display:flex; justify-content:space-between; align-items:flex-start;">
                                <h3 class="word-title">${item.word}</h3>
                            </div>
                            <div><span class="pos-badge">${item.pos}</span></div>
                            <div class="phonetic">${displayPhonetic}</div>
                            <div class="translation">${item.translation}</div>
                            <div class="card-actions">
                                <button class="btn-speak" onclick="speakWord('${item.word}')">🔊 PLAY</button>
                                <button class="btn-del" onclick="deleteWord('${item.word}')">DELETE</button>
                            </div>
                        </div>
                        `;
                    }).join('');
                }
            } catch (err) { container.innerHTML = '<h2 style="grid-column:1/-1; text-align:center; color:red; font-size:3rem;">讀取失敗 💀</h2>'; }
        }
    </script>
</body>
</html>
