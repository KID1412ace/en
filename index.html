<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔥 EPIC VOCAB | 分類翻牌手帳</title>
    <style>
        :root {
            --bg-color: #FFF3E0; --primary: #FF6B6B; --secondary: #FCA311;  
            --tertiary: #4ECDC4; --dark: #3E2723; --border-thick: 6px solid var(--dark);
            --box-shadow-huge: 12px 12px 0px var(--dark); --box-shadow-hover: 18px 18px 0px var(--dark);
        }
        body, html { margin: 0; padding: 0; width: 100%; min-height: 100%; font-family: 'Nunito', 'Arial Black', Impact, sans-serif; background-color: var(--bg-color); color: var(--dark); overflow-x: hidden; scroll-behavior: smooth; background-image: radial-gradient(rgba(62, 39, 35, 0.1) 3px, transparent 3px); background-size: 40px 40px; }
        .decor { position: fixed; z-index: 0; pointer-events: none; border: var(--border-thick); box-shadow: 8px 8px 0px var(--dark); }
        .decor-star { width: 180px; height: 180px; background: var(--secondary); top: 5%; left: -60px; clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%); animation: spin 30s linear infinite;}
        .decor-blob { width: 250px; height: 250px; background: var(--tertiary); bottom: 10%; right: -100px; border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%; animation: morphBlob 12s alternate infinite ease-in-out;}
        @keyframes spin { 100% { transform: rotate(360deg); } }
        @keyframes morphBlob { 0% { transform: scale(1) rotate(0deg); border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%; } 100% { transform: scale(1.1) rotate(20deg); border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%; } }

        .brutal-box { background: #FFF; border: var(--border-thick); border-radius: 20px; box-shadow: var(--box-shadow-huge); position: relative; z-index: 10; transition: all 0.2s; }
        .brutal-btn { background: var(--primary); color: #FFF; border: var(--border-thick); padding: 18px 40px; font-size: 1.6rem; font-family: inherit; font-weight: 900; border-radius: 15px; box-shadow: 8px 8px 0px var(--dark); cursor: pointer; transition: 0.1s; text-transform: uppercase; }
        .brutal-btn:hover { transform: translate(-4px, -4px); box-shadow: var(--box-shadow-hover); background: var(--secondary); color: var(--dark); }
        .brutal-btn:active { transform: translate(4px, 4px); box-shadow: 2px 2px 0px var(--dark); }

        #homePage, #appPage { min-height: 100vh; padding: 4rem 2rem; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; z-index: 10;}
        #appPage { display: none; justify-content: flex-start; padding-top: 2rem;}
        
        .hero-title { font-size: 8rem; font-weight: 900; line-height: 0.9; color: var(--bg-color); text-shadow: 8px 8px 0px var(--dark), -4px -4px 0px var(--primary); margin: 0; text-align: center; transform: rotate(-3deg); -webkit-text-stroke: 4px var(--dark);}
        .hero-subtitle { font-size: 2.2rem; font-weight: bold; background: var(--tertiary); color: var(--dark); border: var(--border-thick); padding: 15px 35px; border-radius: 50px; transform: rotate(2deg); margin: 40px 0 60px 0; box-shadow: 8px 8px 0px var(--dark);}

        .app-container { width: 100%; max-width: 900px; }
        .nav-bar { display: flex; justify-content: space-between; margin-bottom: 3rem; }
        textarea { width: 100%; padding: 25px; margin-bottom: 25px; border: var(--border-thick); border-radius: 16px; font-size: 1.8rem; font-weight: bold; resize: vertical; color: var(--dark); box-shadow: inset 8px 8px 0px rgba(62, 39, 35, 0.1); box-sizing: border-box; background: #FFF; font-family: monospace;}
        textarea:focus { outline: none; background: #FFFCF2; border-color: var(--secondary); }

        /* --- 分類標籤列設計 --- */
        .category-bar { display: flex; gap: 15px; margin-bottom: 30px; overflow-x: auto; padding: 10px 5px; scrollbar-width: none; }
        .category-bar::-webkit-scrollbar { display: none; }
        .cat-btn { background: #FFF; color: var(--dark); border: 4px solid var(--dark); padding: 10px 25px; font-size: 1.5rem; font-weight: 900; border-radius: 50px; cursor: pointer; white-space: nowrap; box-shadow: 4px 4px 0px var(--dark); transition: 0.2s;}
        .cat-btn:hover { transform: translateY(-3px); box-shadow: 6px 6px 0px var(--dark); background: var(--secondary);}
        .cat-btn.active { background: var(--primary); color: #FFF; transform: translate(2px, 2px); box-shadow: 2px 2px 0px var(--dark); }

        /* 單字卡視覺 */
        .vocab-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 3.5rem; padding-bottom: 6rem;}
        .vocab-card { padding: 2.5rem 1.5rem 1.5rem 1.5rem; display: flex; flex-direction: column; background: #FFF; transform: rotate(-1deg); }
        .vocab-card:nth-child(even) { transform: rotate(1.5deg); }
        .vocab-card:hover { transform: scale(1.05) rotate(0deg) translateY(-10px); box-shadow: var(--box-shadow-hover); z-index: 20;}
        .tape { position: absolute; top: -20px; left: 50%; transform: translateX(-50%) rotate(-4deg); width: 140px; height: 45px; background: rgba(255, 107, 107, 0.9); border: var(--border-thick); z-index: 2;}
        .vocab-card:nth-child(even) .tape { background: rgba(78, 205, 196, 0.9); transform: translateX(-50%) rotate(4deg); }

        /* 翻牌卡 */
        .flip-container { perspective: 1000px; flex-grow: 1; cursor: pointer; min-height: 220px; margin-top: 10px; }
        .flip-inner { position: relative; width: 100%; height: 100%; text-align: center; transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1); transform-style: preserve-3d; }
        .flip-container.is-flipped .flip-inner { transform: rotateY(180deg); }
        .flip-front, .flip-back { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #FFF; }
        .flip-back { transform: rotateY(180deg); }
        
        .cat-badge { position: absolute; top: 0; left: 0; background: var(--tertiary); border-bottom: 3px solid var(--dark); border-right: 3px solid var(--dark); padding: 2px 10px; font-weight: 900; font-size: 0.9rem; border-radius: 12px 0 10px 0;}
        .word-title { font-size: 3rem; font-weight: 900; margin: 0 0 15px 0; color: var(--dark); text-transform: lowercase;}
        .pos-badge { font-size: 1.2rem; font-weight: bold; padding: 6px 18px; border: 3px solid var(--dark); border-radius: 12px; background: var(--secondary); box-shadow: 4px 4px 0px var(--dark); display: inline-block; margin-bottom: 20px;}
        .phonetic { font-size: 1.6rem; font-family: monospace; font-weight: 900; background: var(--dark); color: #FFF; padding: 8px 15px; border-radius: 10px; display: inline-block; transform: skewX(-8deg);}
        .translation-huge { font-size: 3rem; font-weight: 900; color: var(--primary); border-bottom: 6px dashed var(--dark); padding-bottom: 15px;}
        .flip-hint { font-size: 1rem; font-weight: 900; color: var(--tertiary); margin-top: 20px; animation: bounceHint 1.5s infinite; }
        @keyframes bounceHint { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(8px); } }

        .card-actions { display: flex; gap: 15px; margin-top: 20px; padding-top: 15px; border-top: 4px dashed rgba(0,0,0,0.1); }
        .btn-speak { flex: 2; background: var(--tertiary); color: var(--dark); border: 4px solid var(--dark); border-radius: 12px; font-size: 1.4rem; font-weight: 900; cursor: pointer; padding: 12px; box-shadow: 5px 5px 0px var(--dark); transition: 0.1s;}
        .btn-speak:active { transform: translate(4px, 4px); box-shadow: 1px 1px 0px var(--dark); }
        .btn-del { flex: 1; background: var(--bg-color); color: var(--dark); border: 4px solid var(--dark); border-radius: 12px; font-size: 1.4rem; font-weight: 900; cursor: pointer; box-shadow: 5px 5px 0px var(--dark);}
        
        #status { font-size: 1.8rem; font-weight: 900; background: #FFF; color: var(--dark); padding: 18px 40px; border: var(--border-thick); border-radius: 20px; display: none; position: fixed; top: 40px; left: 50%; transform: translateX(-50%); z-index: 1000; box-shadow: 12px 12px 0px var(--dark); }
        #addModal { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(62, 39, 35, 0.85); backdrop-filter: blur(10px); z-index: 2000; justify-content: center; align-items: center;}
        .modal-content { background: var(--bg-color); padding: 4rem; width: 90%; max-width: 550px; transform: rotate(-1deg); }
        .modal-content input { width: 100%; border: var(--border-thick); border-radius: 12px; font-size: 1.6rem; padding: 18px; margin-bottom: 25px; box-shadow: inset 5px 5px 0px rgba(0,0,0,0.05); box-sizing: border-box; font-family: inherit; font-weight: bold;}
    </style>
</head>
<body>

    <div class="decor decor-star"></div>
    <div class="decor decor-blob"></div>
    <div id="status">系統訊息</div>

    <div id="homePage">
        <h1 class="hero-title">EPIC<br>VOCAB</h1>
        <div class="hero-subtitle">🚀 視覺衝擊！分類翻轉手帳 🚀</div>
        <button class="brutal-btn" style="font-size: 2.5rem; padding: 25px 70px;" onclick="switchPage('appPage')">LET'S GO ➔</button>
    </div>

    <div id="appPage">
        <div class="app-container">
            <div class="nav-bar">
                <button class="brutal-btn" style="background: #FFF; color: var(--dark);" onclick="switchPage('homePage')">🏠 返回</button>
                <button class="brutal-btn" style="background: var(--tertiary); color: var(--dark);" onclick="document.getElementById('addModal').style.display='flex'">➕ 手動擴充</button>
            </div>

            <div class="brutal-box" style="padding: 3.5rem; margin-bottom: 5rem;">
                <h2 style="margin-top:0; font-size: 3.5rem; font-weight: 900;">🔥 丟入文章</h2>
                <textarea id="article" rows="3" placeholder="丟入英文，自動歸類到「自動萃取」..."></textarea>
                <button id="submitBtn" class="brutal-btn" style="width: 100%; font-size: 2rem;" onclick="processText()">自動萃取 & 建立翻牌</button>
            </div>
            
            <div style="display:flex; justify-content:space-between; align-items:flex-end;">
                <h2 style="font-size: 4rem; margin-bottom: 0; font-weight: 900;">📚 單字翻翻卡</h2>
                <button class="brutal-btn" style="padding: 15px 30px; font-size: 1.6rem; background: var(--secondary); color:var(--dark);" onclick="fetchDataFromServer()">🔄 雲端同步</button>
            </div>

            <!-- 動態分類標籤列 -->
            <div id="categoryBar" class="category-bar"></div>

            <div id="vocabContainer" class="vocab-grid"></div>
        </div>
    </div>

    <div id="addModal">
        <div class="brutal-box modal-content">
            <h2 style="margin-top:0; font-size: 3.5rem;">➕ 暴力塞字</h2>
            <input type="text" id="m-word" placeholder="單字 (必填)">
            <input type="text" id="m-category" placeholder="自訂類別 (例: 多益必考)">
            <input type="text" id="m-pos" placeholder="詞性 (例: Noun)">
            <input type="text" id="m-phonetic" placeholder="IPA 音標 (例: /æpəl/)">
            <input type="text" id="m-trans" placeholder="中文翻譯 (必填)">
            <div style="display:flex; gap:20px; margin-top:20px;">
                <button class="brutal-btn" style="background:#FFF; color:var(--dark); flex:1;" onclick="document.getElementById('addModal').style.display='none'">取消</button>
                <button class="brutal-btn" style="flex:1;" onclick="manualAddWord()">確認新增</button>
            </div>
        </div>
    </div>

    <script>
        const GAS_URL = 'https://script.google.com/macros/s/AKfycbw2XJTyDTPHMCvdGe76FXTn8QAtI1SMoEtvM7L4TrJprufqQkamZ5Xdp0OUzs-wZqSG4g/exec'; // ⚠️ 請填入你的網址
        let vocabCache = []; // 前端資料快取
        let currentCategory = '全部'; // 當前選擇的類別

        function switchPage(pageId) {
            document.getElementById('homePage').style.display = 'none';
            document.getElementById('appPage').style.display = 'none';
            document.getElementById(pageId).style.display = 'flex';
            if(pageId === 'appPage' && vocabCache.length === 0) fetchDataFromServer();
            window.scrollTo(0, 0);
        }

        function showMsg(msg) {
            const el = document.getElementById('status');
            el.innerText = msg; el.style.display = 'block';
            setTimeout(() => { el.style.display = 'none'; }, 3000);
        }

        function speakWord(event, word) {
            event.stopPropagation(); 
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(word);
                utterance.lang = 'en-US';
                window.speechSynthesis.speak(utterance);
            }
        }

        // --- 核心：渲染分類標籤與卡片 ---
        function renderCards() {
            const container = document.getElementById('vocabContainer');
            const catBar = document.getElementById('categoryBar');
            
            if (vocabCache.length === 0) {
                catBar.innerHTML = '';
                container.innerHTML = '<h2 style="grid-column:1/-1; text-align:center; font-size:3rem;">目前沒有單字，快去新增吧！</h2>';
                return;
            }

            // 1. 抓取所有不重複的類別並生成標籤按鈕
            const categories = ['全部', ...new Set(vocabCache.map(item => item.category))];
            catBar.innerHTML = categories.map(cat => `
                <button class="cat-btn ${cat === currentCategory ? 'active' : ''}" 
                        onclick="setCategory('${cat}')">${cat}</button>
            `).join('');

            // 2. 依照當前類別過濾資料
            const filteredData = currentCategory === '全部' 
                ? vocabCache 
                : vocabCache.filter(item => item.category === currentCategory);

            // 3. 生成卡片 HTML
            container.innerHTML = filteredData.map(item => `
                <div class="brutal-box vocab-card">
                    <div class="tape"></div>
                    <div class="flip-container" onclick="this.classList.toggle('is-flipped')">
                        <div class="flip-inner">
                            <div class="flip-front">
                                <div class="cat-badge">${item.category}</div>
                                <h3 class="word-title">${item.word}</h3>
                                <span class="pos-badge">${item.pos}</span>
                                <div class="phonetic">${item.phonetic}</div>
                                <div class="flip-hint">👉 點擊翻面</div>
                            </div>
                            <div class="flip-back">
                                <div class="cat-badge">${item.category}</div>
                                <div class="translation-huge">${item.translation}</div>
                                <div class="flip-hint">👉 點擊翻回</div>
                            </div>
                        </div>
                    </div>
                    <div class="card-actions">
                        <button class="btn-speak" onclick="speakWord(event, '${item.word}')">🔊 PLAY</button>
                        <button class="btn-del" onclick="deleteWord(event, '${item.word}')">✕ DEL</button>
                    </div>
                </div>
            `).join('');
        }

        // 切換類別並重新渲染畫面 (不需要重新 fetch)
        function setCategory(cat) {
            currentCategory = cat;
            renderCards();
        }

        // 從雲端抓取資料並存入快取
        async function fetchDataFromServer() {
            const container = document.getElementById('vocabContainer');
            container.innerHTML = '<h2 style="grid-column:1/-1; text-align:center; font-size:3rem;">雲端同步中... ☁️</h2>';
            try {
                const res = await fetch(GAS_URL);
                const result = await res.json();
                if (result.status === 'success') {
                    vocabCache = result.data.reverse();
                    renderCards();
                }
            } catch (err) { container.innerHTML = '<h2 style="grid-column:1/-1; text-align:center; color:red; font-size:3rem;">讀取失敗 💀</h2>'; }
        }

        // --- 字典引擎 ---
        async function fetchDictFrontend(rawWord) {
            let w = rawWord.toLowerCase().trim();
            let pos = "Unknown", ipa = "無音標";
            try {
                let res = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${w}`);
                if (res.ok) {
                    let data = (await res.json())[0];
                    if (data.meanings && data.meanings[0]) pos = data.meanings[0].partOfSpeech;
                    if (data.phonetic) ipa = data.phonetic;
                    else if (data.phonetics) {
                        let p = data.phonetics.find(x => x.text);
                        if (p) ipa = p.text;
                    }
                }
            } catch(e) {}
            if (ipa && ipa !== "無音標") ipa = `/${ipa.replace(/\//g, '')}/`;
            if (pos !== "Unknown") pos = pos.charAt(0).toUpperCase() + pos.slice(1);
            return { word: w, pos: pos, phonetic: ipa };
        }

        // --- 資料寫入 ---
        async function processText() {
            const text = document.getElementById('article').value;
            const btn = document.getElementById('submitBtn');
            if (!text.trim()) return showMsg("⚠️ 內容不能為空！");

            btn.disabled = true; btn.innerText = "🔍 後端引擎解析中..."; showMsg("⏳ 正在萃取並抓取音標...");
            
            const wordsArray = text.toLowerCase().match(/\b[a-z]+\b/g) || [];
            const uniqueWords = [...new Set(wordsArray)];
            if (uniqueWords.length === 0) { btn.disabled = false; btn.innerText = "自動萃取 & 建立翻牌"; return showMsg("⚠️ 無有效單字"); }

            const enrichedWords = await Promise.all(uniqueWords.map(async w => {
                const data = await fetchDictFrontend(w);
                data.category = '自動萃取'; // 萃取進來的單字自動賦予類別
                return data;
            }));

            try {
                const res = await fetch(GAS_URL, {
                    method: 'POST', body: JSON.stringify({ action: 'save_words', words: enrichedWords }),
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' }
                });
                const result = await res.json();
                if (result.status === 'success') {
                    showMsg(`✅ 成功建立 ${enrichedWords.length} 張翻牌！`);
                    document.getElementById('article').value = '';
                    fetchDataFromServer();
                }
            } catch (err) { showMsg("❌ 伺服器連線失敗"); }
            finally { btn.disabled = false; btn.innerText = "自動萃取 & 建立翻牌"; }
        }

        async function manualAddWord() {
            const rawWord = document.getElementById('m-word').value;
            if(!rawWord) return alert("單字為必填欄位！");
            showMsg("⏳ 寫入中...");
            document.getElementById('addModal').style.display = 'none';

            const dictResult = await fetchDictFrontend(rawWord);
            const userPos = document.getElementById('m-pos').value;
            const userIpa = document.getElementById('m-phonetic').value;
            
            dictResult.category = document.getElementById('m-category').value || "自訂單字";
            if (userPos) dictResult.pos = userPos;
            if (userIpa) dictResult.phonetic = userIpa.includes('/') ? userIpa : `/${userIpa}/`;

            try {
                await fetch(GAS_URL, {
                    method: 'POST', 
                    body: JSON.stringify({ action: 'add', ...dictResult, translation: document.getElementById('m-trans').value }),
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' }
                });
                showMsg(`✅ 已新增`);
                document.querySelectorAll('#addModal input').forEach(inp => inp.value = '');
                fetchDataFromServer();
            } catch (err) { showMsg("❌ 新增失敗"); }
        }

        async function deleteWord(event, word) {
            event.stopPropagation(); 
            if(!confirm(`確定要刪除「${word}」嗎？`)) return;
            showMsg(`⏳ 刪除中...`);
            try {
                await fetch(GAS_URL, {
                    method: 'POST', body: JSON.stringify({ action: 'delete', word: word }),
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' }
                });
                showMsg(`✅ 已刪除`);
                fetchDataFromServer(); // 刪除後重新同步
            } catch (err) { showMsg("❌ 刪除失敗"); }
        }
    </script>
</body>
</html>
